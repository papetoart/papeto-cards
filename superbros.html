  // --- 8-BIT WEB AUDIO SYNTHESIZER ---
  var audioCtx = null;
  var muted = false;

  function initAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  muteBtn.onclick = function() {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  };

  function playTone(freq, endFreq, duration, type, vol) {
    if (muted) return;
    initAudio();
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol || 0.07, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

      ctx.arcTo(x + w, y, x + w, y + h, r);

  function detonateBarrel(bar) {
    if (!bar.alive) return;
    bar.alive = false;
    sfx.boom();
    spawnParticles(bar.x + 15, bar.y + 19, '#ef4444', 24);
    spawnParticles(bar.x + 15, bar.y + 19, '#facc15', 20);
    floatingPopups.push({ x: bar.x + 15, y: bar.y - 8, text: '💥 BOOM!', color: '#f97316', life: 36 });

    var radius = 130;
    var cx = bar.x + 15;
    var cy = bar.y + 19;

    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (en.alive && Math.hypot((en.x + en.w / 2) - cx, (en.y + en.h / 2) - cy) <= radius) {
        damageEnemy(en, 6.0, 0, true);
      }
    }
    // Chain reaction on nearby barrels!
    for (var b = 0; b < barrels.length; b++) {
      var other = barrels[b];
      if (other.alive && Math.hypot((other.x + 15) - cx, (other.y + 19) - cy) <= radius) {
        detonateBarrel(other);
      }
    }
  }

    var radius = isOvercharged() ? 115 : 95;
    var mult = isOvercharged() ? 1.25 : 1.0;

    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (en.alive && Math.hypot((en.x + en.w / 2) - x, (en.y + en.h / 2) - y) <= radius) {
        damageEnemy(en, 5.5 * mult, 0, true);
      }
    }
    for (var b = 0; b < barrels.length; b++) {
      var bar = barrels[b];
      if (bar.alive && Math.hypot((bar.x + 15) - x, (bar.y + 19) - y) <= radius) {
        detonateBarrel(bar);
      }
    }
    if (bossActive && boss && boss.alive) {
      var bx = boss.x + boss.w / 2;
      var by = boss.y + boss.h / 2;
      if (Math.hypot(bx - x, by - y) <= radius + 45) {
        damageBoss(4.8 * mult);
      }
    }
  }

    if (mode !== 'play' || player.atkCooldown > 0) return;
    var wpn = getActiveWeapon();
    var mult = isOvercharged() ? 1.25 : 1.0;

    if (wpn === 'BLASTER') {
      player.atkCooldown = 11;
      sfx.blaster();

        kind: 'blaster',

    } else if (wpn === 'FIRE') {
      player.atkCooldown = 15;
      sfx.fire();
      projectiles.push({
        kind: 'fire',
        x: player.facing === 1 ? player.x + player.w + 4 : player.x - 10,
        y: player.y + 18,
        vx: player.facing * 9.0,
        vy: 1.8,
        dmg: 3.0 * mult,
        armorPiercing: true,

      });

    } else if (wpn === 'HYPER BEAM') {
      player.atkCooldown = 15;
      sfx.hyperBeam();
      var angles = [-0.13, 0, 0.13];
      var sx = player.facing === 1 ? player.x + player.w + 6 : player.x - 18;
      var sy = player.y + 18;
      for (var a = 0; a < angles.length; a++) {
        projectiles.push({
          kind: 'hyper',
          x: sx,
          y: sy,
          vx: player.facing * Math.cos(angles[a]) * 14,
          vy: Math.sin(angles[a]) * 14,
          dmg: 1.7 * mult,
          armorPiercing: true,
          pierce: true,
          life: 60
        });
      }

    } else if (wpn === 'OMEGA NOVA') {
      player.atkCooldown = 23;
      sfx.omegaNova();
      projectiles.push({
        kind: 'nova',
        x: player.facing === 1 ? player.x + player.w + 8 : player.x - 16,
        y: player.y + 16,
        vx: player.facing * 9.8,
        vy: 0,
        dmg: 1.2 * mult,
        armorPiercing: true,
        life: 75
      });
    }
  }

  function grantMysteryBoxReward(blk) {
    var r = blk.reward;
    if (r === 'hyper' || r === 'nova') {
      superWeapon = r === 'hyper' ? 'HYPER BEAM' : 'OMEGA NOVA';
      superWeaponTimer = SUPER_WEAPON_MAX_TIME;
      score += 500;
      sfx.powerup();
      spawnParticles(blk.x + 20, blk.y, '#38bdf8', 22);
      floatingPopups.push({ x: blk.x + 20, y: blk.y - 10, text: '⚡ ' + superWeapon + ' (15s)!', color: '#38bdf8', life: 48 });
      stageBannerText = superWeapon + ' ACTIVATED FOR 15 SECONDS!';
      stageBannerTimer = 85;
    } else if (r === 'life_up') {
      if (player.maxHp < 8) {
        player.maxHp++;
        player.hp = Math.min(player.maxHp, player.hp + 2);
        var msg = player.maxHp === 5 ? '♥ +1 MAX LIFE (OVERCHARGE UNLOCKED!)' : '♥ +1 MAX LIFE!';
        floatingPopups.push({ x: blk.x + 20, y: blk.y - 10, text: msg, color: '#f43f5e', life: 52 });
        stageBannerText = 'MAX LIVES: ' + player.maxHp + (player.maxHp >= 5 ? ' (OVERCHARGE POWER ACTIVE!)' : '');
        stageBannerTimer = 85;
      } else {
        player.hp = player.maxHp;
        floatingPopups.push({ x: blk.x + 20, y: blk.y - 10, text: '♥ FULL HEAL!', color: '#f43f5e', life: 48 });
      }
      score += 500;
      sfx.lifeUp();
      spawnParticles(blk.x + 20, blk.y, '#f43f5e', 20);
    } else if (r === 'shield') {
      player.shieldTimer = 420;
      score += 600;
      sfx.powerup();
      spawnParticles(blk.x + 20, blk.y, '#facc15', 22);
      floatingPopups.push({ x: blk.x + 20, y: blk.y - 10, text: '★ SHIELD (7s)!', color: '#facc15', life: 48 });
      stageBannerText = 'STAR SHIELD ACTIVE (7 SEC INVINCIBLE)!';
      stageBannerTimer = 85;
    } else {
      coins += 5;
      if (player.maxHp < 8) player.maxHp++;
      player.hp = Math.min(player.maxHp, player.hp + 1);
      score += 1000;
      sfx.lifeUp();
      spawnParticles(blk.x + 20, blk.y, '#4ade80', 22);
      floatingPopups.push({ x: blk.x + 20, y: blk.y - 10, text: '+5 COINS & ♥ MAX UP!', color: '#4ade80', life: 48 });
    }
  }

  function damageEnemy(en, dmg, knockX, armorPiercing) {
    var actualDmg = dmg;
    if (en.kind === 'armored' && !armorPiercing) {
      actualDmg = 0.7;
      sfx.armorClink();
      spawnParticles(en.x + en.w / 2, en.y + 12, '#cbd5e1', 5);
      floatingPopups.push({ x: en.x + en.w / 2, y: en.y - 8, text: 'ARMOR! USE FIRE', color: '#94a3b8', life: 24 });
    }
    en.hp -= actualDmg;
    en.x += (knockX || 0);
    if (en.hp <= 0) {
      en.alive = false;
      score += en.kind === 'armored' ? 450 : 250;
      sfx.hitEnemy();
      spawnParticles(en.x + en.w / 2, en.y + en.h / 2, '#ef4444', 15);
    } else if (en.kind !== 'armored' || armorPiercing) {
      sfx.hitEnemy();
      spawnParticles(en.x + en.w / 2, en.y + en.h / 2, '#facc15', 6);
    }
  }

  function damageBoss(dmg) {
    if (!boss || !boss.alive || boss.hurtTimer > 0) return;
    boss.hp -= dmg;
    boss.hurtTimer = 5;
    score += 150;
    sfx.hitEnemy();
    spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, '#facc15', 10);

    if (boss.hp <= 0 && !stageClearing) {
      boss.hp = 0;
      boss.alive = false;
      bossShots = [];
      meteors = [];
      bossLaser = null;
      shockwaves = [];
      stageClearing = true;

      var heartBonus = player.hp * 500;
      score += (1500 * currentStage) + heartBonus;
      sfx.win();

      for (var k = 0; k < 10; k++) {
        spawnParticles(boss.x + Math.random() * boss.w, boss.y + Math.random() * boss.h, k % 2 === 0 ? '#facc15' : '#38bdf8', 20);
        fireworks.push({
          x: arenaLeftWall + 120 + Math.random() * 540,
          y: 90 + Math.random() * 140,
          color: k % 3 === 0 ? '#facc15' : (k % 3 === 1 ? '#38bdf8' : '#4ade80'),
          timer: k * 14
        });
      }

      if (currentStage < maxStages) {
        stageBannerText = 'STAGE ' + currentStage + ' CLEAR! HEART BONUS: +' + heartBonus;
        stageBannerTimer = 140;
        setTimeout(function() {
          if (mode === 'play') loadStage(currentStage + 1, true, false);
        }, 2400);
      } else {
        setTimeout(function() {
          showVictory('MEGA TITAN DEFEATED! ALL 11 STAGES CLEARED BY ' + playerName + '!');
        }, 1800);
      }
    }
  }

  function hurtPlayer() {
    if (player.invuln > 0 || player.dashTimer > 0 || player.shieldTimer > 0 || stageClearing) return;

    // Last Stand mechanic if player built 6+ Max Hearts!
    if (player.hp === 1 && player.maxHp >= 6) {
      player.maxHp--;
      player.hp = 2;
      player.invuln = 90;
      triggerNovaExplosion(player.x + 17, player.y + 20);
      floatingPopups.push({ x: player.x + 17, y: player.y - 16, text: '★ LAST STAND SAVE!', color: '#facc15', life: 55 });
      return;
    }

    player.hp--;
    player.invuln = 72;
    player.vy = -7;
    sfx.hurt();
    spawnParticles(player.x + 17, player.y + 20, '#ef4444', 14);
    if (player.hp <= 0) {
      showGameOver();
    }
  }

  function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 6.5,
        vy: -Math.random() * 6.5 - 1,
        color: color,
        life: 22 + Math.random() * 14
      });
    }
  }

  function rectIntersect(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function isOverPit(xCenter) {
    if (inBonusRoom) return false;
    for (var i = 0; i < pits.length; i++) {
      if (xCenter > pits[i].x + 10 && xCenter < pits[i].x + pits[i].w - 10) return true;
    }
    return false;
  }

  function update() {
    frame++;
    if (stageBannerTimer > 0) stageBannerTimer--;
    if (player.invuln > 0) player.invuln--;
    if (player.shieldTimer > 0) player.shieldTimer--;
    if (player.dashCooldown > 0) player.dashCooldown--;
    if (player.atkCooldown > 0) player.atkCooldown--;

    // Timed Super Weapon Countdown
    if (superWeaponTimer > 0) {
      superWeaponTimer--;
      if (superWeaponTimer === 0) {
        superWeapon = null;
        stageBannerText = 'SUPER WEAPON EXPIRED! BACK TO ' + baseWeapons[baseWpnIdx];
        stageBannerTimer = 75;
      }
    }

    // Secret Bonus Room Timer
    if (inBonusRoom) {
      bonusTimer--;
      if (bonusTimer <= 0) {
        exitSecretBonusRoom();
        return;
      }
    }

    // Update Moving Platforms (Main Stage)
    if (!inBonusRoom) {
      for (var mp = 0; mp < movingPlats.length; mp++) {
        var plat = movingPlats[mp];
        plat.x += plat.vx;
        if (plat.x <= plat.minX || plat.x + plat.w >= plat.maxX) plat.vx *= -1;
      }
      for (var cp = 0; cp < crumblePlats.length; cp++) {
        var cr = crumblePlats[cp];
        if (cr.state === 'shaking') {
          cr.timer--;
          if (cr.timer <= 0) {
            cr.state = 'fallen';
            cr.respawn = 210; // 3.5s respawn
            spawnParticles(cr.x + cr.w / 2, cr.y + 8, '#d97706', 10);
          }
        } else if (cr.state === 'fallen') {
          cr.respawn--;
          if (cr.respawn <= 0) cr.state = 'solid';
        }
      }
      for (var jp = 0; jp < jumpPads.length; jp++) {
        if (jumpPads[jp].bounceTimer > 0) jumpPads[jp].bounceTimer--;
      }
    }

    // Movement & Electric Dash
    if (player.dashTimer > 0) {
      player.dashTimer--;
      player.vx = player.facing * 14.0;
      player.vy = 0;
      if (frame % 2 === 0) {
        afterimages.push({ x: player.x, y: player.y, facing: player.facing, life: 12 });
      }
    } else {
      if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -player.speed;
        player.facing = -1;
      } else if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = player.speed;
        player.facing = 1;
      } else {
        player.vx *= 0.78;
        if (Math.abs(player.vx) < 0.2) player.vx = 0;
      }
      player.vy += gravity;
    }

    player.x += player.vx;
    var minBound = inBonusRoom ? 20 : (bossActive ? arenaLeftWall + 6 : 10);
    var maxBound = inBonusRoom ? 745 : (arenaRightWall - player.w - 6);
    if (player.x < minBound) player.x = minBound;
    if (player.x > maxBound) player.x = maxBound;

    var activeBlocks = inBonusRoom ? bonusBlocks : blocks;
    for (var i = 0; i < activeBlocks.length; i++) {
      var blk = activeBlocks[i];
      if (rectIntersect(player, blk)) {
        if (blk.type === 'exit_pipe') {
          exitSecretBonusRoom();
          return;
        }
        if (player.vx > 0) player.x = blk.x - player.w;
        else if (player.vx < 0) player.x = blk.x + blk.w;
      }
    }

    player.y += player.vy;
    player.grounded = false;

    // Ground Collision (respecting Lava/Spike Pits!)
    var pCenter = player.x + player.w / 2;
    if (!isOverPit(pCenter) && player.y + player.h >= 430 && player.y + player.h - player.vy <= 446) {
      player.y = 430 - player.h;
      player.vy = 0;
      player.grounded = true;
      player.jumpsLeft = 2;
      if (!inBonusRoom) {
        player.safeX = player.x;
        player.safeY = player.y;
      }
    }

    // Fall into Lava/Spike Pit -> Take 1 damage & bounce back to safe ground!
    if (!inBonusRoom && player.y > 468) {
      player.hp--;
      sfx.hurt();
      spawnParticles(player.x + 17, 455, '#f97316', 18);
      if (player.hp <= 0) {
        showGameOver();
        return;
      }
      player.x = player.safeX;
      player.y = player.safeY - 12;
      player.vx = 0;
      player.vy = 0;
      player.invuln = 75;
    }

    // Solid Blocks & '?' Boxes Collision
    for (var i = 0; i < activeBlocks.length; i++) {
      var blk = activeBlocks[i];
      if (blk.bump > 0) blk.bump -= 1.5;
      if (blk.type === 'empty' && blk.regenerating && blk.respawnTimer > 0) {
        blk.respawnTimer--;
        if (blk.respawnTimer <= 0) {
          blk.type = 'q_box';
          spawnParticles(blk.x + 20, blk.y + 20, '#facc15', 10);
        }
      }
      if (rectIntersect(player, blk)) {
        if (blk.type === 'exit_pipe') {
          exitSecretBonusRoom();
          return;
        }
        if (player.vy > 0) {
          player.y = blk.y - player.h;
          player.vy = 0;
          player.grounded = true;
          player.jumpsLeft = 2;
        } else if (player.vy < 0) {
          player.y = blk.y + blk.h;
          player.vy = 1.5;
          blk.bump = 9;
          if (blk.type === 'q_box') {
            blk.type = 'empty';
            if (blk.regenerating) blk.respawnTimer = 600;
            grantMysteryBoxReward(blk);
          } else if (blk.type === 'brick') {
            score += 50;
            sfx.hitEnemy();
            spawnParticles(blk.x + 20, blk.y + 20, '#d97706', 8);
          }
        }
      }
    }

    // Moving Platforms, Crumbling Platforms, Jump Pads & Coins (Main Stage)
    if (!inBonusRoom) {
      for (var mp = 0; mp < movingPlats.length; mp++) {
        var plat = movingPlats[mp];
        if (player.vy >= 0 && player.x + player.w > plat.x + 4 && player.x < plat.x + plat.w - 4 &&
            player.y + player.h >= plat.y && player.y + player.h - player.vy <= plat.y + 14) {
          player.y = plat.y - player.h;
          player.vy = 0;
          player.grounded = true;
          player.jumpsLeft = 2;
          player.x += plat.vx;
        }
      }
      for (var cp = 0; cp < crumblePlats.length; cp++) {
        var cr = crumblePlats[cp];
        if (cr.state !== 'fallen' && player.vy >= 0 && player.x + player.w > cr.x + 4 && player.x < cr.x + cr.w - 4 &&
            player.y + player.h >= cr.y && player.y + player.h - player.vy <= cr.y + 14) {
          player.y = cr.y - player.h;
          player.vy = 0;
          player.grounded = true;
          player.jumpsLeft = 2;
          if (cr.state === 'solid') {
            cr.state = 'shaking';
            cr.timer = 38;
          }
        }
      }
      for (var jp = 0; jp < jumpPads.length; jp++) {
        var pad = jumpPads[jp];
        if (rectIntersect(player, pad) && player.vy >= 0) {
          player.vy = -18.5;
          player.grounded = false;
          player.jumpsLeft = 2;
          pad.bounceTimer = 15;
          sfx.spring();
          spawnParticles(pad.x + 18, pad.y, '#4ade80', 14);
        }
      }

      // Collect Floating Stage Coins
      for (var sc = 0; sc < stageCoins.length; sc++) {
        var cn = stageCoins[sc];
        if (!cn.collected && Math.hypot((player.x + 17) - cn.x, (player.y + 21) - cn.y) < 28) {
          cn.collected = true;
          coins++;
          score += 100;
          sfx.coin();
          spawnParticles(cn.x, cn.y, '#facc15', 6);
        }
      }

      // Boss Arena Lock
      if (!bossActive && player.x >= arenaStartX + 40) {
        bossActive = true;
        if (boss && boss.isMega) {
          player.hp = player.maxHp;
          superWeapon = 'HYPER BEAM';
          superWeaponTimer = SUPER_WEAPON_MAX_TIME;
          stageBannerText = 'HYPER BEAM ACTIVATED (15s) - HIT ? BOXES TO RELOAD!';
          stageBannerTimer = 95;
        } else {
          player.hp = Math.min(player.maxHp, player.hp + 1);
          stageBannerText = 'WARNING! ' + boss.name + ' APPROACHES!';
          stageBannerTimer = 85;
        }
        sfx.bossRoar();
        spawnParticles(player.x + 17, player.y + 10, '#4ade80', 18);
      }

      // Enemies Update (including Electric Dash attacks!)
      for (var e = 0; e < enemies.length; e++) {
        var en = enemies[e];
        if (!en.alive) continue;
        en.x += en.vx;
        if (en.x <= en.minX || en.x + en.w >= en.maxX) en.vx *= -1;
        if (en.kind === 'flyer') {
          en.y = en.baseY + Math.sin(frame * 0.08 + e) * 24;
        }

        if (rectIntersect(player, en)) {
          if (player.dashTimer > 0) {
            // Electric Dash zaps enemies!
            damageEnemy(en, 3.5, player.facing * 8, true);
            spawnParticles(en.x + en.w / 2, en.y + en.h / 2, '#38bdf8', 14);
          } else if (player.shieldTimer > 0) {
            damageEnemy(en, 6.0, 0, true);
          } else if (player.vy > 0 && player.y + player.h - player.vy <= en.y + 16) {
            player.vy = -9.8;
            player.jumpsLeft = 2;
            damageEnemy(en, 3.0, 0, true);
          } else {
            hurtPlayer();
          }
        }
      }

      // Boss AI with Unique Attack Styles
      if (bossActive && boss && boss.alive) {
        if (boss.hurtTimer > 0) boss.hurtTimer--;
        boss.facing = player.x < boss.x + boss.w / 2 ? -1 : 1;
        var rage = boss.isMega && boss.hp <= boss.maxHp * 0.5;

        // Stage 11 Titan summons reinforcements at 50% HP
        if (boss.isMega && rage && !boss.summonedMinions) {
          boss.summonedMinions = true;
          stageBannerText = 'TITAN RAGE! FUD REINFORCEMENTS SUMMONED!';
          stageBannerTimer = 85;
          enemies.push({ x: arenaLeftWall + 60, y: 394, w: 34, h: 36, vx: 2.2, alive: true, minX: arenaLeftWall + 20, maxX: arenaRightWall - 20, kind: 'walker', hp: 1 });
          enemies.push({ x: arenaRightWall - 90, y: 215, w: 36, h: 28, vx: -2.4, alive: true, minX: arenaLeftWall + 20, maxX: arenaRightWall - 20, kind: 'flyer', baseY: 215, hp: 1 });
        }

        boss.x += boss.vx * (rage ? 1.2 : 1.0);
        if (boss.x <= arenaLeftWall + 14) { boss.x = arenaLeftWall + 14; boss.vx = Math.abs(boss.vx); }
        if (boss.x + boss.w >= arenaRightWall - 14) { boss.x = arenaRightWall - 14 - boss.w; boss.vx = -Math.abs(boss.vx); }

        var wasAirborne = boss.y + boss.h < 430;
        boss.jumpTimer--;
        if (boss.jumpTimer <= 0 && !wasAirborne) {
          boss.vy = boss.isMega ? -14.5 : -13.5;
          boss.vx = boss.facing * (2.6 + currentStage * 0.1);
          boss.jumpTimer = boss.isMega ? (rage ? 110 : 145) : (difficulty === 'hard' ? 115 : 155);
          sfx.bossRoar();
        }
        boss.vy += gravity;
        boss.y += boss.vy;
        if (boss.y + boss.h >= 430) {
          boss.y = 430 - boss.h;
          boss.vy = 0;
          if (wasAirborne && (boss.isMega || boss.style === 'spikes' || boss.style === 'forest')) {
            var wSpd = boss.style === 'spikes' ? 6.0 : 5.2;
            shockwaves.push({ x: boss.x, y: 414, w: 22, h: 16, vx: -wSpd, life: 130 });
            shockwaves.push({ x: boss.x + boss.w - 22, y: 414, w: 22, h: 16, vx: wSpd, life: 130 });
            spawnParticles(boss.x + boss.w / 2, 428, '#38bdf8', 16);
          }
        }

        // Primary Ranged Attack
        boss.attackTimer--;
        if (boss.attackTimer === 24) boss.telegraphTimer = 24;
        if (boss.telegraphTimer > 0) boss.telegraphTimer--;

        if (boss.attackTimer <= 0) {
          var baseCd = difficulty === 'hard' ? 75 : (difficulty === 'easy' ? 120 : 95);
          boss.attackTimer = boss.isMega ? (rage ? 72 : 90) : Math.max(62, baseCd - currentStage * 2);
          var centerAngle = Math.atan2((player.y + 20) - (boss.y + boss.h * 0.42), (player.x + 17) - (boss.x + boss.w / 2));
          var spd = (difficulty === 'hard' ? 5.0 : 4.2) + (boss.isMega ? 0.4 : currentStage * 0.1);

          if (boss.isMega || boss.style === 'forest') {
            var fan = [-0.24, 0, 0.24];
            for (var f = 0; f < fan.length; f++) {
              bossShots.push({
                x: boss.x + boss.w / 2,
                y: boss.y + boss.h * 0.42,
                vx: Math.cos(centerAngle + fan[f]) * spd,
                vy: Math.sin(centerAngle + fan[f]) * spd,
                life: 165
              });
            }
          } else {
            bossShots.push({
              x: boss.x + boss.w / 2,
              y: boss.y + 52,
              vx: Math.cos(centerAngle) * spd,
              vy: Math.sin(centerAngle) * spd,
              life: 150
            });
          }
          sfx.fire();
        }

        // Signature Special Attack per Boss Style!
        boss.specialTimer--;
        if (boss.specialTimer <= 0) {
          boss.specialTimer = difficulty === 'hard' ? 160 : 210;
          if (boss.style === 'meteor') {
            // Summon 3 sky meteors with ground warning targets
            for (var m = 0; m < 3; m++) {
              var mx = arenaLeftWall + 90 + Math.random() * 600;
              meteors.push({ x: mx, y: -40 - m * 45, vy: 6.5, targetX: mx });
            }
          } else if (boss.style === 'laser' || (boss.isMega && rage)) {
            // Sweeping Horizontal Laser Beam (40 frames warning line, 28 frames active beam)
            bossLaser = { y: 392, warnTimer: 42, activeTimer: 28 };
            sfx.laser();
          } else if (boss.style === 'spikes') {
            shockwaves.push({ x: boss.x, y: 414, w: 22, h: 16, vx: -6.4, life: 130 });
            shockwaves.push({ x: boss.x + boss.w - 22, y: 414, w: 22, h: 16, vx: 6.4, life: 130 });
          }
        }

        if (rectIntersect(player, boss)) {
          if (player.vy > 0 && player.y + player.h - player.vy <= boss.y + 30) {
            player.vy = -11;
            player.jumpsLeft = 2;
            damageBoss(3.0);
          } else {
            hurtPlayer();
          }
        }
      }
    } else {
      // Collect Secret Vault Coins
      for (var bc = 0; bc < bonusCoins.length; bc++) {
        var bcn = bonusCoins[bc];
        if (!bcn.collected && Math.hypot((player.x + 17) - bcn.x, (player.y + 21) - bcn.y) < 30) {
          bcn.collected = true;
          coins++;
          score += 150;
          sfx.coin();
          spawnParticles(bcn.x, bcn.y, '#facc15', 7);
        }
      }
    }

    // Player Projectiles Update
    for (var f = projectiles.length - 1; f >= 0; f--) {
      var fb = projectiles[f];
      fb.x += fb.vx;
      fb.y += (fb.vy || 0);
      if (fb.kind === 'fire') {
        fb.vy += 0.45;
        if (fb.y >= 420) { fb.y = 420; fb.vy = -6.5; }
      }
      fb.life--;

      var hitWall = false;
      for (var b = 0; b < activeBlocks.length; b++) {
        if (fb.x > activeBlocks[b].x && fb.x < activeBlocks[b].x + activeBlocks[b].w &&
            fb.y > activeBlocks[b].y && fb.y < activeBlocks[b].y + activeBlocks[b].h) {
          hitWall = true; break;
        }
      }

      if (!inBonusRoom) {
        // Hit Exploding Barrels!
        for (var br = 0; br < barrels.length; br++) {
          var bar = barrels[br];
          if (bar.alive && fb.x > bar.x && fb.x < bar.x + bar.w && fb.y > bar.y && fb.y < bar.y + bar.h) {
            detonateBarrel(bar);
            hitWall = true;
            break;
          }
        }

        if (!hitWall) {
          for (var e = 0; e < enemies.length; e++) {
            var en = enemies[e];
            if (en.alive && fb.x > en.x && fb.x < en.x + en.w && fb.y > en.y && fb.y < en.y + en.h) {
              if (fb.kind === 'nova') {
                triggerNovaExplosion(fb.x, fb.y);
                hitWall = true;
              } else {
                damageEnemy(en, fb.dmg, fb.vx > 0 ? 4 : -4, !!fb.armorPiercing);
                if (!fb.pierce) hitWall = true;
              }
              break;
            }
          }
        }

        if (!hitWall && bossActive && boss && boss.alive && fb.x > boss.x && fb.x < boss.x + boss.w && fb.y > boss.y && fb.y < boss.y + boss.h) {
          if (fb.kind === 'nova') {
            triggerNovaExplosion(fb.x, fb.y);
          } else {
            damageBoss(fb.dmg);
          }
          hitWall = true;
        }
      }

      if (hitWall || fb.life <= 0) {
        if (fb.kind === 'nova' && !hitWall && !inBonusRoom) triggerNovaExplosion(fb.x, fb.y);
        spawnParticles(fb.x, fb.y, fb.kind === 'hyper' ? '#38bdf8' : '#facc15', 5);
        projectiles.splice(f, 1);
      }
    }

    // Boss Projectiles, Meteors, Laser & Shockwaves
    if (!inBonusRoom) {
      for (var bs = bossShots.length - 1; bs >= 0; bs--) {
        var s = bossShots[bs];
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
        if (s.x > player.x + 4 && s.x < player.x + player.w - 4 && s.y > player.y + 4 && s.y < player.y + player.h - 4) {
          hurtPlayer();
          bossShots.splice(bs, 1);
          continue;
        }
        if (s.life <= 0 || s.y > 430) bossShots.splice(bs, 1);
      }

      for (var m = meteors.length - 1; m >= 0; m--) {
        var mt = meteors[m];
        mt.y += mt.vy;
        if (Math.abs((player.x + 17) - mt.x) < 22 && Math.abs((player.y + 21) - mt.y) < 24) {
          hurtPlayer();
          spawnParticles(mt.x, mt.y, '#ef4444', 12);
          meteors.splice(m, 1);
          continue;
        }
        if (mt.y >= 425) {
          sfx.boom();
          spawnParticles(mt.x, 425, '#f97316', 14);
          meteors.splice(m, 1);
        }
      }

      if (bossLaser) {
        if (bossLaser.warnTimer > 0) {
          bossLaser.warnTimer--;
        } else if (bossLaser.activeTimer > 0) {
          bossLaser.activeTimer--;
          if (player.y + player.h > bossLaser.y - 8 && player.y < bossLaser.y + 12) {
            hurtPlayer();
          }
        } else {
          bossLaser = null;
        }
      }

      for (var sw = shockwaves.length - 1; sw >= 0; sw--) {
        var wv = shockwaves[sw];
        wv.x += wv.vx;
        wv.life--;
        if (rectIntersect(player, wv)) {
          hurtPlayer();
          shockwaves.splice(sw, 1);
          continue;
        }
        if (wv.life <= 0 || wv.x < arenaLeftWall || wv.x > arenaRightWall) shockwaves.splice(sw, 1);
      }
    }

    for (var a = afterimages.length - 1; a >= 0; a--) {
      afterimages[a].life--;
      if (afterimages[a].life <= 0) afterimages.splice(a, 1);
    }
    for (var p = particles.length - 1; p >= 0; p--) {
      particles[p].x += particles[p].vx;
      particles[p].y += particles[p].vy;
      particles[p].vy += 0.25;
      particles[p].life--;
      if (particles[p].life <= 0) particles.splice(p, 1);
    }
    for (var fp = floatingPopups.length - 1; fp >= 0; fp--) {
      floatingPopups[fp].y -= 1.2;
      floatingPopups[fp].life--;
      if (floatingPopups[fp].life <= 0) floatingPopups.splice(fp, 1);
    }
    for (var fw = fireworks.length - 1; fw >= 0; fw--) {
      fireworks[fw].timer--;
      if (fireworks[fw].timer === 0) {
        spawnParticles(fireworks[fw].x, fireworks[fw].y, fireworks[fw].color, 26);
        fireworks.splice(fw, 1);
      }
    }

    if (inBonusRoom) {
      camX = 0;
    } else if (bossActive) {
      var targetCam = arenaLeftWall - 10;
      camX += (targetCam - camX) * 0.12;
    } else {
      camX = Math.max(0, player.x - 240);
    }
  }

  function showGameOver() {
    mode = 'over';
    statusLine.textContent = 'GAME OVER ON STAGE ' + currentStage + ' / 11 | SCORE: ' + score;
    startBtn.style.display = 'none';
    continueBtn.style.display = 'inline-block';
    continueBtn.textContent = 'CONTINUE (STAGE ' + currentStage + ')';
    restartBtn.style.display = 'inline-block';
    overlay.style.display = 'flex';
  }

  function showVictory(msg) {
    mode = 'over';
    statusLine.textContent = msg + ' | FINAL SCORE: ' + score;
    startBtn.style.display = 'none';
    continueBtn.style.display = 'none';
    restartBtn.style.display = 'inline-block';
    overlay.style.display = 'flex';
  }

  function drawBackground() {
    if (inBonusRoom) {
      var bSky = ctx.createLinearGradient(0, 0, 0, 430);
      bSky.addColorStop(0, '#090d16');
      bSky.addColorStop(1, '#311042');
      ctx.fillStyle = bSky;
      ctx.fillRect(0, 0, W, 430);
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.16)';
      ctx.lineWidth = 2;
      for (var gx = 0; gx < W; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 430); ctx.stroke();
      }
      return;
    }

    var t = STAGE_THEMES[currentStage - 1];
    var sky = ctx.createLinearGradient(0, 0, 0, 430);
    sky.addColorStop(0, t.skyTop);
    sky.addColorStop(0.6, t.skyMid);
    sky.addColorStop(1, t.skyBot);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, 430);

    if (currentStage >= 5 && currentStage !== 7) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
      for (var st = 0; st < 36; st++) {
        var sx = (st * 97) % W;
        var sy = 40 + (st * 53) % 190;
        ctx.fillRect(sx, sy, st % 4 === 0 ? 3 : 2, st % 4 === 0 ? 3 : 2);
      }
    }

    ctx.fillStyle = currentStage === 11 ? 'rgba(56, 189, 248, 0.25)' : 'rgba(254, 240, 138, 0.28)';
    ctx.beginPath(); ctx.arc(680, 78, 54, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = currentStage === 11 ? '#a855f7' : (currentStage === 9 ? '#e2e8f0' : '#fef08a');
    ctx.beginPath(); ctx.arc(680, 78, 30, 0, Math.PI * 2); ctx.fill();
    if (currentStage === 11) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(680, 78, 52, 12, -0.25, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = t.hillFar;
    for (var h = -1; h < 10; h++) {
      var hx = h * 340 - (camX * 0.2) % 340;
      ctx.beginPath();
      ctx.moveTo(hx, 430);
      ctx.quadraticCurveTo(hx + 170, 230, hx + 340, 430);
      ctx.fill();
    }

    for (var g = -1; g < 10; g++) {
      var gx = g * 380 - (camX * 0.45) % 380;
      ctx.fillStyle = t.hillNear;
      ctx.beginPath();
      ctx.moveTo(gx, 430);
      ctx.quadraticCurveTo(gx + 190, 290, gx + 380, 430);
      ctx.fill();
      ctx.strokeStyle = t.hillRim;
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    for (var c = 0; c < 18; c++) {
      var cx = (c * 310 - (camX * 0.3)) % 5580;
      if (cx < -120) cx += 5580;
      var cy = 65 + (c % 3) * 35;
      ctx.fillStyle = currentStage === 11 ? 'rgba(192, 132, 252, 0.35)' : 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI * 2);
      ctx.arc(cx + 22, cy - 8, 26, 0, Math.PI * 2);
      ctx.arc(cx + 46, cy, 20, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGroundAndHazards() {
    if (inBonusRoom) {
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(0, 430, W, 70);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(0, 430, W, 10);
      return;
    }

    var t = STAGE_THEMES[currentStage - 1];
    ctx.fillStyle = t.soil;
    ctx.fillRect(0, 430, W, 70);

    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 2;
    var offset = -(camX % 40);
    for (var x = offset; x < W; x += 40) {
      ctx.strokeRect(x, 444, 40, 28);
      ctx.strokeRect(x - 20, 472, 40, 28);
    }

    var grassGrad = ctx.createLinearGradient(0, 430, 0, 446);
    grassGrad.addColorStop(0, t.grassTop);
    grassGrad.addColorStop(0.5, t.grassMid);
    grassGrad.addColorStop(1, t.grassBot);
    ctx.fillStyle = grassGrad;
    ctx.fillRect(0, 430, W, 16);

    // Draw Lava / Spike Pits cutting through the ground
    for (var i = 0; i < pits.length; i++) {
      var pit = pits[i];
      var px = Math.round(pit.x - camX);
      if (px + pit.w < -20 || px > W + 20) continue;

      ctx.fillStyle = '#090d16';
      ctx.fillRect(px, 430, pit.w, 70);

      // Bubbling Lava / Energy Hazard at bottom of pit
      var wave = Math.sin(frame * 0.15) * 3;
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(px, 466 + wave, pit.w, 34);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(px, 466 + wave, pit.w, 5);
    }

    // Moving Platforms
    for (var mp = 0; mp < movingPlats.length; mp++) {
      var plat = movingPlats[mp];
      var mx = Math.round(plat.x - camX);
      if (mx + plat.w < -30 || mx > W + 30) continue;
      ctx.fillStyle = '#38bdf8';
      drawRoundRect(mx, plat.y, plat.w, plat.h, 6);
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(mx + 8, plat.y + 4, plat.w - 16, 4);
    }

    // Crumbling Platforms
    for (var cp = 0; cp < crumblePlats.length; cp++) {
      var cr = crumblePlats[cp];
      if (cr.state === 'fallen') continue;
      var cx = Math.round(cr.x - camX);
      if (cx + cr.w < -30 || cx > W + 30) continue;
      var shakeX = cr.state === 'shaking' ? (Math.random() - 0.5) * 6 : 0;
      ctx.fillStyle = cr.state === 'shaking' ? '#ef4444' : '#d97706';
      drawRoundRect(cx + shakeX, cr.y, cr.w, cr.h, 5);
      ctx.fill();
      ctx.strokeStyle = '#451a03';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Jump Pads (Springs)
    for (var jp = 0; jp < jumpPads.length; jp++) {
      var pad = jumpPads[jp];
      var jx = Math.round(pad.x - camX);
      if (jx + pad.w < -30 || jx > W + 30) continue;
      var lift = pad.bounceTimer > 0 ? -8 : 0;
      ctx.fillStyle = '#475569';
      ctx.fillRect(jx + 6, pad.y + 6, pad.w - 12, 12);
      ctx.fillStyle = '#22c55e';
      drawRoundRect(jx, pad.y + lift, pad.w, 8, 4);
      ctx.fill();
      ctx.strokeStyle = '#dcfce7';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Exploding Barrels
    for (var br = 0; br < barrels.length; br++) {
      var bar = barrels[br];
      if (!bar.alive) continue;
      var bx = Math.round(bar.x - camX);
      if (bx + bar.w < -30 || bx > W + 30) continue;
      ctx.fillStyle = '#dc2626';
      drawRoundRect(bx, bar.y, bar.w, bar.h, 6);
      ctx.fill();
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#facc15';
      ctx.fillRect(bx + 2, bar.y + 8, bar.w - 4, 4);
      ctx.fillRect(bx + 2, bar.y + 26, bar.w - 4, 4);
      ctx.font = '900 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('TNT', bx + bar.w / 2, bar.y + 22);
      ctx.textAlign = 'left';
    }

    // Stage Coins
    for (var sc = 0; sc < stageCoins.length; sc++) {
      var cn = stageCoins[sc];
      if (cn.collected) continue;
      var cnx = Math.round(cn.x - camX);
      if (cnx < -20 || cnx > W + 20) continue;
      var bob = Math.sin(frame * 0.12 + sc) * 3;
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.ellipse(cnx, cn.y + bob, 7, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#854d0e';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  function drawBlocks() {
    var activeBlocks = inBonusRoom ? bonusBlocks : blocks;
    for (var i = 0; i < activeBlocks.length; i++) {
      var b = activeBlocks[i];
      var bx = Math.round(b.x - camX);
      var by = Math.round(b.y - b.bump);
      if (bx + b.w < -50 || bx > W + 50) continue;

      if (b.type === 'brick') {
        var grad = ctx.createLinearGradient(bx, by, bx, by + b.h);
        grad.addColorStop(0, '#ea580c');
        grad.addColorStop(1, '#9a3412');
        ctx.fillStyle = grad;
        ctx.fillRect(bx, by, b.w, b.h);
        ctx.strokeStyle = '#431407';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx + 1, by + 1, b.w - 2, b.h - 2);

      } else if (b.type === 'q_box') {
        var qGrad = ctx.createLinearGradient(bx, by, bx, by + b.h);
        qGrad.addColorStop(0, '#fef08a');
        qGrad.addColorStop(0.5, '#facc15');
        qGrad.addColorStop(1, '#ca8a04');
        ctx.fillStyle = qGrad;
        ctx.fillRect(bx, by, b.w, b.h);
        ctx.strokeStyle = '#713f12';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx + 1, by + 1, b.w - 2, b.h - 2);

        ctx.font = '900 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#713f12';
        ctx.fillText('?', bx + b.w / 2 + 1.5, by + 29.5);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('?', bx + b.w / 2, by + 28);
        ctx.textAlign = 'left';

      } else if (b.type === 'empty') {
        ctx.fillStyle = '#475569';
        ctx.fillRect(bx, by, b.w, b.h);
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx + 1, by + 1, b.w - 2, b.h - 2);

      } else if (b.type === 'pipe' || b.type === 'warp_pipe' || b.type === 'exit_pipe') {
        var isWarp = b.type === 'warp_pipe' && !b.used;
        var isExit = b.type === 'exit_pipe';
        var pGrad = ctx.createLinearGradient(bx, by, bx + b.w, by);
        if (isWarp || isExit) {
          pGrad.addColorStop(0, '#6b21a8');
          pGrad.addColorStop(0.4, '#c084fc');
          pGrad.addColorStop(1, '#3b0764');
        } else {
          pGrad.addColorStop(0, '#15803d');
          pGrad.addColorStop(0.3, '#4ade80');
          pGrad.addColorStop(0.7, '#22c55e');
          pGrad.addColorStop(1, '#14532d');
        }

        ctx.fillStyle = pGrad;
        ctx.fillRect(bx + 4, by + 22, b.w - 8, b.h - 22);
        ctx.strokeStyle = isWarp || isExit ? '#facc15' : '#052e16';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx + 4, by + 22, b.w - 8, b.h - 22);

        ctx.fillStyle = pGrad;
        ctx.fillRect(bx, by, b.w, 22);
        ctx.strokeRect(bx, by, b.w, 22);

        if (isWarp) {
          ctx.font = '900 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = frame % 16 < 8 ? '#fef08a' : '#38bdf8';
          ctx.fillText('▼ SECRET', bx + b.w / 2, by - 8);
          ctx.textAlign = 'left';
        } else if (isExit) {
          ctx.font = '900 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#4ade80';
          ctx.fillText('EXIT ▶', bx + b.w / 2, by - 8);
          ctx.textAlign = 'left';
        }
      }
    }

    if (inBonusRoom) {
      for (var bc = 0; bc < bonusCoins.length; bc++) {
        var bcn = bonusCoins[bc];
        if (bcn.collected) continue;
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.ellipse(bcn.x, bcn.y + Math.sin(frame * 0.15 + bc) * 3, 7, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawEnemies() {
    if (inBonusRoom) return;
    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (!en.alive) continue;
      var ex = Math.round(en.x - camX);
      var ey = Math.round(en.y);
      if (ex + en.w < -40 || ex > W + 40) continue;

      if (en.kind === 'armored') {
        // Heavy Armored Knight (Fire Cannon melts it!)
        ctx.fillStyle = '#334155';
        drawRoundRect(ex + 2, ey + 6, en.w - 4, en.h - 10, 8);
        ctx.fill();
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Steel Helmet Visor
        ctx.fillStyle = '#64748b';
        ctx.fillRect(ex + 4, ey, en.w - 8, 14);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(ex + 9, ey + 6, 7, 4);
        ctx.fillRect(ex + 22, ey + 6, 7, 4);

        // Front Shield Plate
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(en.vx < 0 ? ex - 2 : ex + en.w - 6, ey + 10, 8, 22);

      } else if (en.kind === 'flyer') {
        var wing = Math.sin(frame * 0.4) * 7;
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(ex + 2, ey - 4 + wing, 12, 6);
        ctx.fillRect(ex + 22, ey - 4 - wing, 12, 6);

        ctx.fillStyle = '#7e22ce';
        drawRoundRect(ex + 4, ey + 2, 28, 22, 8);
        ctx.fill();
        ctx.strokeStyle = '#3b0764';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#facc15';
        ctx.fillRect(ex + 9, ey + 9, 5, 5);
        ctx.fillRect(ex + 22, ey + 9, 5, 5);
      } else {
        var bounce = Math.abs(Math.sin(frame * 0.15 + e)) * 3;
        ctx.fillStyle = en.hp > 1 ? '#4c1d95' : '#991b1b';
        ctx.beginPath();
        ctx.arc(ex + en.w / 2, ey + en.h / 2 + 2 - bounce, 16, Math.PI, 0);
        ctx.lineTo(ex + en.w, ey + en.h - 4);
        ctx.lineTo(ex, ey + en.h - 4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#1e1b4b';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fef08a';
        ctx.fillRect(ex + 7, ey + 14 - bounce, 6, 6);
        ctx.fillRect(ex + 21, ey + 14 - bounce, 6, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(ex + 9, ey + 16 - bounce, 3, 3);
        ctx.fillRect(ex + 22, ey + 16 - bounce, 3, 3);
      }
    }
  }

  function drawBoss() {
    if (inBonusRoom || !boss || !boss.alive) return;
    var t = STAGE_THEMES[currentStage - 1];
    var bx = Math.round(boss.x - camX);
    var by = Math.round(boss.y);
    if (bx > W + 150) return;

    if (bossActive) {
      var wallX = Math.round(arenaLeftWall - camX);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
      ctx.fillRect(wallX, 0, 8, 430);
    }

    if (boss.hurtTimer > 0 && frame % 2 === 0) {
      ctx.fillStyle = '#ffffff';
      drawRoundRect(bx, by, boss.w, boss.h, 20);
      ctx.fill();
      return;
    }

    var breath = Math.sin(frame * 0.1) * 3;

    if (boss.isMega) {
      var wingFlap = Math.sin(frame * 0.14) * 14;
      ctx.fillStyle = 'rgba(168, 85, 247, 0.55)';
      ctx.beginPath();
      ctx.moveTo(bx + 15, by + 50);
      ctx.lineTo(bx - 48, by + 10 + wingFlap);
      ctx.lineTo(bx - 30, by + 95);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(bx + boss.w - 15, by + 50);
      ctx.lineTo(bx + boss.w + 48, by + 10 + wingFlap);
      ctx.lineTo(bx + boss.w + 30, by + 95);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = t.bossBody;
    drawRoundRect(bx + 6, by + 16 + breath, boss.w - 12, boss.h - 24, 18);
    ctx.fill();
    ctx.strokeStyle = boss.telegraphTimer > 0 ? '#fef08a' : t.bossRim;
    ctx.lineWidth = boss.telegraphTimer > 0 ? 5 : 3;
    ctx.stroke();

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    drawRoundRect(bx + 20, by + 48 + breath, boss.w - 40, boss.h - 76, 12);
    ctx.fill();

    ctx.fillStyle = t.bossHorn;
    ctx.beginPath();
    ctx.moveTo(bx + 18, by + 20 + breath);
    ctx.lineTo(bx + 4, by - 6 + breath);
    ctx.lineTo(bx + 34, by + 16 + breath);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(bx + boss.w - 18, by + 20 + breath);
    ctx.lineTo(bx + boss.w - 4, by - 6 + breath);
    ctx.lineTo(bx + boss.w - 34, by + 16 + breath);
    ctx.fill();

    var eyeShift = boss.facing === -1 ? -6 : 6;
    var eyeY = by + (boss.isMega ? 34 : 28) + breath;
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(bx + 22 + eyeShift, eyeY, 16, 11);
    ctx.fillRect(bx + boss.w - 38 + eyeShift, eyeY, 16, 11);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(bx + 27 + eyeShift, eyeY + 2, 6, 7);
    ctx.fillRect(bx + boss.w - 33 + eyeShift, eyeY + 2, 6, 7);

    if (bossActive) {
      var barW = boss.isMega ? 360 : 300;
      var barX = W / 2 - barW / 2;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      drawRoundRect(barX - 4, 44, barW + 8, 22, 8);
      ctx.fill();
      ctx.strokeStyle = boss.isMega ? '#38bdf8' : '#ef4444';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = boss.isMega ? '#a855f7' : '#ef4444';
      ctx.fillRect(barX, 48, barW * (boss.hp / boss.maxHp), 14);
      ctx.font = '900 10px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(boss.name + ': ' + Math.ceil(boss.hp) + ' / ' + boss.maxHp, W / 2, 59);
      ctx.textAlign = 'left';
    }
  }

  function drawPlayer() {
    for (var a = 0; a < afterimages.length; a++) {
      var ai = afterimages[a];
      ctx.fillStyle = 'rgba(56, 189, 248, ' + (ai.life / 22) + ')';
      drawRoundRect(Math.round(ai.x - camX), Math.round(ai.y), player.w, player.h, 8);
      ctx.fill();
    }

    if (player.invuln > 0 && Math.floor(frame / 4) % 2 === 0) return;

    var px = Math.round(player.x - camX);
    var py = Math.round(player.y);

    // Visual Auras for Shield, Electric Dash, Super Weapons, or Heart Overcharge!
    if (player.dashTimer > 0) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(px + player.w / 2, py + player.h / 2, 28, 0, Math.PI * 2);
      ctx.stroke();
    } else if (player.shieldTimer > 0) {
      ctx.strokeStyle = frame % 6 < 3 ? '#facc15' : '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(px + player.w / 2, py + player.h / 2, 29 + Math.sin(frame * 0.35) * 3, 0, Math.PI * 2);
      ctx.stroke();
    } else if (superWeaponTimer > 0) {
      ctx.strokeStyle = superWeapon === 'HYPER BEAM' ? 'rgba(56, 189, 248, 0.8)' : 'rgba(168, 85, 247, 0.85)';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(px + player.w / 2, py + player.h / 2, 27 + Math.sin(frame * 0.25) * 3, 0, Math.PI * 2);
      ctx.stroke();
    } else if (isOvercharged()) {
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.55)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(px + player.w / 2, py + player.h / 2, 25 + Math.sin(frame * 0.2) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Player Name + Low HP Warning
    ctx.font = '900 11px sans-serif';
    ctx.textAlign = 'center';
    var nameW = ctx.measureText(playerName).width + 12;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
    drawRoundRect(px + player.w / 2 - nameW / 2, py - 24, nameW, 16, 6);
    ctx.fill();
    ctx.fillStyle = selectedHero === 'pepe' ? '#4ade80' : '#fef08a';
    ctx.fillText(playerName, px + player.w / 2, py - 12);

    if (player.hp === 1 && frame % 18 < 10) {
      ctx.font = '900 9px sans-serif';
      ctx.fillStyle = '#f43f5e';
      ctx.fillText('♥ LOW HP!', px + player.w / 2, py - 30);
    }
    ctx.textAlign = 'left';

    var runOffset = (Math.abs(player.vx) > 0.5 && player.grounded) ? Math.sin(frame * 0.35) * 3 : 0;

    if (selectedHero === 'pepe') {
      ctx.fillStyle = '#1e40af';
      ctx.fillRect(px + 6 + runOffset, py + 30, 8, 12);
      ctx.fillRect(px + 20 - runOffset, py + 30, 8, 12);
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(px + 5, py + 18, 24, 14);
      ctx.fillStyle = '#4ade80';
      drawRoundRect(px + 3, py + 4, 28, 17, 7);
      ctx.fill();
      ctx.strokeStyle = '#14532d';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(px + 11, py + 4, 6, 0, Math.PI * 2);
      ctx.arc(px + 23, py + 4, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px + 11, py + 4, 4, 0, Math.PI * 2);
      ctx.arc(px + 23, py + 4, 4, 0, Math.PI * 2);
      ctx.fill();
      var pupilShift = player.facing === 1 ? 1.5 : -1.5;
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(px + 11 + pupilShift, py + 4, 2, 0, Math.PI * 2);
      ctx.arc(px + 23 + pupilShift, py + 4, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#dc2626';
      var lipX = player.facing === 1 ? px + 11 : px + 4;
      drawRoundRect(lipX, py + 13, 18, 5, 2.5);
      ctx.fill();
    } else {
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(px + 6 + runOffset, py + 30, 8, 12);
      ctx.fillRect(px + 20 - runOffset, py + 30, 8, 12);
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(px + 5, py + 18, 24, 15);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(px + 9, py + 22, 4, 4);
      ctx.fillRect(px + 21, py + 22, 4, 4);
      ctx.fillStyle = '#f59e0b';
      drawRoundRect(px + 4, py + 2, 26, 20, 7);
      ctx.fill();
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#fef3c7';
      var snoutX = player.facing === 1 ? px + 16 : px + 4;
      ctx.fillRect(snoutX, py + 11, 13, 8);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(player.facing === 1 ? px + 26 : px + 4, py + 11, 3, 3);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(player.facing === 1 ? px + 20 : px + 10, py + 7, 3, 4);
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(px + 4, py - 1, 26, 5);
      ctx.fillRect(player.facing === 1 ? px + 14 : px, py + 2, 20, 3);
    }

    // Distinct Visible Weapon Graphics Held by the Hero!
    var wpn = getActiveWeapon();
    var gx = player.facing === 1 ? px + 22 : px - 12;
    if (wpn === 'BLASTER') {
      ctx.fillStyle = '#334155';
      ctx.fillRect(gx, py + 20, 18, 7);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.facing === 1 ? gx + 14 : gx, py + 21, 5, 5);
    } else if (wpn === 'FIRE') {
      // Heavy Orange Flamethrower Cannon + Pilot Flame
      ctx.fillStyle = '#ea580c';
      ctx.fillRect(gx, py + 18, 22, 10);
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(player.facing === 1 ? gx + 24 : gx - 2, py + 23, 4 + Math.sin(frame * 0.5) * 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (wpn === 'HYPER BEAM') {
      // Twin-barrel Golden Railgun
      ctx.fillStyle = '#facc15';
      ctx.fillRect(gx, py + 17, 24, 5);
      ctx.fillRect(gx, py + 24, 24, 5);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.facing === 1 ? gx + 20 : gx, py + 17, 5, 12);
    } else if (wpn === 'OMEGA NOVA') {
      // Orbiting Purple/Gold Nova Orb
      var orbX = player.facing === 1 ? px + 40 : px - 6;
      var orbY = py + 20 + Math.sin(frame * 0.25) * 4;
      ctx.fillStyle = '#a855f7';
      ctx.beginPath(); ctx.arc(orbX, orbY, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(orbX, orbY, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.fillRect(0, 0, W, 36);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(0, 35, W, 1.5);

    ctx.font = '900 11px sans-serif';
    ctx.fillStyle = selectedHero === 'pepe' ? '#4ade80' : '#38bdf8';
    ctx.fillText(playerName, 10, 23);

    var hearts = '';
    for (var h = 0; h < player.maxHp; h++) hearts += h < player.hp ? '♥' : '♡';
    ctx.fillStyle = isOvercharged() ? '#facc15' : '#f43f5e';
    ctx.font = player.maxHp > 6 ? '900 11.5px sans-serif' : '900 13.5px sans-serif';
    ctx.fillText(hearts, 102, 23);

    ctx.font = '900 10.5px sans-serif';
    ctx.fillStyle = '#e9d5ff';
    ctx.fillText(inBonusRoom ? ('VAULT:' + Math.ceil(bonusTimer / 60) + 's') : ('STG ' + currentStage + '/11'), 208, 23);

    var activeWpn = getActiveWeapon();
    if (superWeaponTimer > 0) {
      var secsLeft = Math.ceil(superWeaponTimer / 60);
      ctx.fillStyle = secsLeft <= 3 && frame % 8 < 4 ? '#f43f5e' : '#38bdf8';
      ctx.fillText('⚡' + activeWpn + ' ' + secsLeft + 's', 278, 21);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
      ctx.fillRect(278, 26, 122, 4);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(278, 26, 122 * (superWeaponTimer / SUPER_WEAPON_MAX_TIME), 4);
    } else {
      ctx.fillStyle = activeWpn === 'FIRE' ? '#fb923c' : '#c084fc';
      ctx.fillText('WPN:' + activeWpn, 278, 23);
    }

    ctx.fillStyle = player.dashCooldown <= 0 ? '#38bdf8' : '#64748b';
    ctx.fillText(player.dashCooldown <= 0 ? 'DASH:OK' : 'DASH...', 416, 23);

    ctx.fillStyle = '#facc15';
    ctx.fillText('COINS:' + coins, 484, 23);

    ctx.fillStyle = '#4ade80';
    ctx.fillText('SCORE:' + score, 558, 23);

    if (stageBannerTimer > 0) {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      drawRoundRect(W / 2 - 265, 82, 530, 42, 12);
      ctx.fill();
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '900 13.5px sans-serif';
      ctx.fillStyle = '#fef08a';
      ctx.textAlign = 'center';
      ctx.fillText(stageBannerText, W / 2, 108);
      ctx.textAlign = 'left';
    }
  }

  function render() {
    drawBackground();
    drawBlocks();
    drawGroundAndHazards();
    drawEnemies();
    drawBoss();
    drawPlayer();

    var scale = isOvercharged() ? 1.35 : 1.0;
    for (var f = 0; f < projectiles.length; f++) {
      var fb = projectiles[f];
      if (fb.kind === 'blaster') {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(fb.x - camX - 8 * scale, fb.y - 3 * scale, 18 * scale, 6 * scale);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(fb.x - camX - 4 * scale, fb.y - 1.5 * scale, 10 * scale, 3 * scale);
      } else if (fb.kind === 'hyper') {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(fb.x - camX - 14 * scale, fb.y - 4 * scale, 28 * scale, 8 * scale);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(fb.x - camX - 10 * scale, fb.y - 2 * scale, 20 * scale, 4 * scale);
      } else if (fb.kind === 'nova') {
        ctx.fillStyle = '#a855f7';
        ctx.beginPath(); ctx.arc(fb.x - camX, fb.y, 13 * scale, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.arc(fb.x - camX, fb.y, 8 * scale, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(fb.x - camX, fb.y, 4 * scale, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.arc(fb.x - camX, fb.y, 8 * scale, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(fb.x - camX, fb.y, 4 * scale, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (!inBonusRoom) {
      for (var bs = 0; bs < bossShots.length; bs++) {
        var s = bossShots[bs];
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(s.x - camX, s.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(s.x - camX, s.y, 3.5, 0, Math.PI * 2); ctx.fill();
      }

      // Falling Meteors + Ground Warning Crosshairs
      for (var m = 0; m < meteors.length; m++) {
        var mt = meteors[m];
        ctx.fillStyle = 'rgba(239, 68, 68, 0.45)';
        ctx.fillRect(mt.targetX - camX - 16, 424, 32, 6);
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.arc(mt.x - camX, mt.y, 14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(mt.x - camX, mt.y, 7, 0, Math.PI * 2); ctx.fill();
      }

      // Boss Sweeping Horizontal Laser Beam
      if (bossLaser) {
        var lx = arenaLeftWall - camX;
        if (bossLaser.warnTimer > 0) {
          ctx.strokeStyle = frame % 6 < 3 ? '#facc15' : '#ef4444';
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.moveTo(lx, bossLaser.y);
          ctx.lineTo(lx + 780, bossLaser.y);
          ctx.stroke();
          ctx.setLineDash([]);
        } else {
          ctx.fillStyle = 'rgba(239, 68, 68, 0.85)';
          ctx.fillRect(lx, bossLaser.y - 8, 780, 18);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(lx, bossLaser.y - 3, 780, 6);
        }
      }

      for (var sw = 0; sw < shockwaves.length; sw++) {
        var wv = shockwaves[sw];
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(wv.x - camX, wv.y + wv.h);
        ctx.lineTo(wv.x - camX + wv.w / 2, wv.y);
        ctx.lineTo(wv.x - camX + wv.w, wv.y + wv.h);
        ctx.closePath();
        ctx.fill();
      }
    }

    for (var fp = 0; fp < floatingPopups.length; fp++) {
      var pop = floatingPopups[fp];
      ctx.font = '900 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0f172a';
      ctx.fillText(pop.text, pop.x - camX + 1, pop.y + 1);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, pop.x - camX, pop.y);
      ctx.textAlign = 'left';
    }

    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - camX, pt.y, 4, 4);
    }

    drawHUD();
  }

  function loop(now) {
    if (mode !== 'play') return;
    if (!lastTime) lastTime = now;
    var dt = now - lastTime;
    lastTime = now;
    if (dt > 100) dt = 100;

    accumulator += dt;
    while (accumulator >= STEP) {
      update();
      accumulator -= STEP;
    }
    render();
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
