 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPERBROS - Playable NFT by PAPETO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: radial-gradient(circle at top, #1e1b4b, #050508);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100dvh;
    padding: 8px 8px 14px;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none;
  }
  #card-frame {
    position: relative;
    width: 96vw;
    max-width: 860px;
    aspect-ratio: 16 / 10;
    border: 3px solid #facc15;
    border-radius: 16px;
    box-shadow: 0 0 45px rgba(250, 204, 21, 0.35), inset 0 0 20px rgba(250, 204, 21, 0.15);
    background: #38bdf8;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  #sig-badge {
    position: absolute;
    top: 40px;
    right: 10px;
    background: rgba(15, 23, 42, 0.82);
    backdrop-filter: blur(6px);
    border: 1.5px solid rgba(250, 204, 21, 0.85);
    border-radius: 20px;
    color: #fde047;
    font-size: clamp(7px, 1.2vw, 10px);
    font-weight: 900;
    padding: 3px 10px;
    letter-spacing: 1px;
    z-index: 4;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  #mute-btn {
    position: absolute;
    top: 6px;
    right: 10px;
    background: rgba(15, 23, 42, 0.9);
    border: 1.5px solid #38bdf8;
    color: #fff;
    border-radius: 8px;
    font-size: 13px;
    padding: 2px 7px;
    cursor: pointer;
    z-index: 15;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(15, 23, 42, 0.94), rgba(5, 5, 10, 0.98));
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #fff;
    padding: 10px 14px;
    z-index: 20;
    touch-action: auto;
  }
  #overlay h1 {
    font-size: clamp(22px, 4.8vw, 44px);
    font-weight: 900;
    background: linear-gradient(180deg, #fef08a 0%, #facc15 45%, #ea580c 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 0 #7c2d12) drop-shadow(0 0 18px rgba(250, 204, 21, 0.5));
    letter-spacing: 2px;
    margin-bottom: 1px;
  }
  .byline {
    font-size: clamp(8px, 1.4vw, 11px);
    color: #38bdf8;
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-weight: 900;
    text-transform: uppercase;
  }
  .setup-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .sel-btn {
    background: rgba(30, 41, 59, 0.92);
    border: 2px solid #475569;
    color: #cbd5e1;
    padding: 5px 13px;
    border-radius: 9px;
    font-weight: 900;
    font-size: clamp(10px, 1.6vw, 12px);
    cursor: pointer;
    transition: all 0.15s;
  }
  .sel-btn.active-doge { border-color: #facc15; background: rgba(250, 204, 21, 0.22); color: #fef08a; box-shadow: 0 0 10px rgba(250, 204, 21, 0.4); }
  .sel-btn.active-pepe { border-color: #4ade80; background: rgba(74, 222, 128, 0.22); color: #bbf7d0; box-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }
  .sel-btn.active-diff { border-color: #38bdf8; background: rgba(56, 189, 248, 0.25); color: #e0f2fe; box-shadow: 0 0 10px rgba(56, 189, 248, 0.45); }

  .name-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 8px;
    width: 100%;
    max-width: 240px;
  }
  .name-box label {
    font-size: 9px;
    font-weight: 800;
    color: #fde047;
    letter-spacing: 1.5px;
    margin-bottom: 3px;
  }
  #player-name-input {
    width: 100%;
    padding: 6px 10px;
    border-radius: 9px;
    border: 2px solid #facc15;
    background: rgba(30, 41, 59, 0.96);
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    text-align: center;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
    touch-action: auto;
  }
  #player-name-input:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
  }
  #overlay p {
    font-size: clamp(8px, 1.3vw, 11px);
    color: #cbd5e1;
    margin-bottom: 9px;
    max-width: 540px;
    line-height: 1.35;
  }
  .action-btn {
    background: linear-gradient(180deg, #22c55e, #15803d);
    color: #fff;
    border: 2px solid #dcfce7;
    padding: 8px 26px;
    font-size: clamp(12px, 2vw, 16px);
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 0 #14532d, 0 8px 18px rgba(0, 0, 0, 0.5);
    text-transform: uppercase;
    border-radius: 11px;
    letter-spacing: 1.5px;
  }
  .action-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #14532d; }

  /* --- MOBILE & DESKTOP ARCADE CONTROLS --- */
  .touch-controls {
    position: relative;
    width: 96vw;
    max-width: 860px;
    margin-top: 8px;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border: 3px solid #334155;
    border-radius: 20px;
    padding: 12px 10px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
    z-index: 999;
  }
  .dpad, .action-group {
    pointer-events: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .tbtn {
    width: 50px;
    height: 52px;
    background: linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 1));
    border: 2px solid #facc15;
    color: #fde047;
    font-weight: 900;
    font-size: 18px;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 0 #854d0e;
  }
  .tbtn:active { transform: translateY(3px); background: #facc15; color: #0f172a; }
  #btn-dash {
    width: 52px;
    height: 52px;
    border-color: #38bdf8;
    color: #7dd3fc;
    font-size: 11px;
    box-shadow: 0 4px 0 #0369a1;
  }
  #btn-dash:active { background: #38bdf8; color: #0f172a; }

  .abtn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    font-weight: 900;
    font-size: 11px;
    font-family: inherit;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    color: #fff;
    text-shadow: 0 2px 2px rgba(0,0,0,0.75);
  }
  #btn-wpn {
    width: 48px;
    height: 48px;
    background: radial-gradient(circle at 30% 30%, #a855f7, #6b21a8);
    border: 2px solid #f3e8ff;
    box-shadow: 0 4px 0 #3b0764;
    font-size: 10px;
  }
  #btn-atk {
    background: radial-gradient(circle at 30% 30%, #ef4444, #991b1b);
    border: 2.5px solid #fee2e2;
    box-shadow: 0 4px 0 #450a0a;
  }
  #btn-jump {
    background: radial-gradient(circle at 30% 30%, #22c55e, #15803d);
    border: 2.5px solid #dcfce7;
    box-shadow: 0 4px 0 #14532d;
  }
  .abtn:active { transform: translateY(3px); }

  @media (orientation: landscape) and (pointer: coarse) {
    body { justify-content: center; padding: 4px; height: 100dvh; }
    #card-frame { height: calc(100dvh - 10px); max-height: calc(100dvh - 10px); width: auto; max-width: 96vw; aspect-ratio: 16 / 10; }
    .touch-controls { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); width: 96vw; background: transparent; border: none; box-shadow: none; padding: 0 10px; }
    .tbtn { width: 44px; height: 44px; font-size: 16px; opacity: 0.75; }
    #btn-dash { width: 46px; height: 44px; font-size: 10px; opacity: 0.75; }
    .abtn { width: 48px; height: 48px; font-size: 10px; opacity: 0.78; }
    #btn-wpn { width: 42px; height: 42px; font-size: 9px; opacity: 0.78; }
  }
  @media (min-width: 1025px) and (pointer: fine) {
    body { justify-content: center; padding: 0; }
    #card-frame { width: 100vw; height: auto; max-height: 94vh; }
    .touch-controls { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 860px; background: transparent; border: none; box-shadow: none; padding: 0 18px; pointer-events: none; }
  }
</style>
</head>
<body>
<div id="card-frame">
  <button id="mute-btn" type="button" title="Toggle Sound">🔊</button>
  <div id="sig-badge">PLAYABLE NFT BY PAPETO</div>
  <canvas id="game" width="800" height="500"></canvas>
  <div id="overlay">
    <h1>SUPERBROS</h1>
    <div class="byline">PLAYABLE NFT BY PAPETO</div>

    <div class="setup-row">
      <button type="button" id="pick-doge" class="sel-btn active-doge">🐶 DOGE</button>
      <button type="button" id="pick-pepe" class="sel-btn">🐸 PEPE</button>
    </div>

    <div class="setup-row">
      <button type="button" id="diff-easy" class="sel-btn">EASY</button>
      <button type="button" id="diff-normal" class="sel-btn active-diff">NORMAL</button>
      <button type="button" id="diff-hard" class="sel-btn">HARD</button>
    </div>

    <div class="name-box">
      <label for="player-name-input">ENTER YOUR PLAYER NAME</label>
      <input type="text" id="player-name-input" maxlength="14" placeholder="PLAYER 1" value="PLAYER 1">
    </div>

    <p>DOUBLE JUMP &bull; DASH &bull; SWORD / BLASTER / FIRE &bull; DEFEAT THE FUD BOSS!<br>[◀/▶] Move &bull; [JUMP x2] Double Jump &bull; [DASH / SHIFT] Dash &bull; [ATK / F] Attack &bull; [WPN / Q] Weapon</p>
    <button id="start-btn" class="action-btn" type="button">PLAY NOW</button>
  </div>
</div>

<div class="touch-controls">
  <div class="dpad">
    <div class="tbtn" data-key="ArrowLeft">◀</div>
    <div class="tbtn" data-key="ArrowRight">▶</div>
    <div id="btn-dash" class="tbtn">DASH</div>
  </div>
  <div class="action-group">
    <div id="btn-wpn" class="abtn">WPN</div>
    <div id="btn-atk" class="abtn">ATK</div>
    <div id="btn-jump" class="abtn">JUMP</div>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var startBtn = document.getElementById('start-btn');
  var nameInput = document.getElementById('player-name-input');
  var pickDoge = document.getElementById('pick-doge');
  var pickPepe = document.getElementById('pick-pepe');
  var diffEasy = document.getElementById('diff-easy');
  var diffNormal = document.getElementById('diff-normal');
  var diffHard = document.getElementById('diff-hard');
  var muteBtn = document.getElementById('mute-btn');

  var W = 800, H = 500;
  var playerName = 'PLAYER 1';
  var selectedHero = 'doge';
  var difficulty = 'normal'; // 'easy', 'normal', 'hard'
  var keys = {}, mode = 'title', frame = 0;
  var score = 0, coins = 0, camX = 0;

  // --- 8-BIT WEB AUDIO SYNTHESIZER ---
  var audioCtx = null;
  var muted = false;

  function initAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  muteBtn.onclick = function() {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  };

  function playTone(freq, endFreq, duration, type, vol) {
    if (muted) return;
    initAudio();
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  var sfx = {
    jump: function() { playTone(260, 560, 0.14, 'square', 0.07); },
    djump: function() { playTone(420, 840, 0.16, 'square', 0.08); },
    dash: function() { playTone(520, 140, 0.14, 'sawtooth', 0.08); },
    sword: function() { playTone(700, 180, 0.11, 'sawtooth', 0.09); },
    blaster: function() { playTone(920, 240, 0.10, 'square', 0.07); },
    fire: function() { playTone(380, 160, 0.13, 'triangle', 0.09); },
    coin: function() {
      playTone(987, 987, 0.07, 'square', 0.07);
      setTimeout(function() { playTone(1318, 1318, 0.16, 'square', 0.07); }, 65);
    },
    heal: function() {
      playTone(523, 659, 0.1, 'triangle', 0.09);
      setTimeout(function() { playTone(784, 1046, 0.18, 'triangle', 0.09); }, 90);
    },
    hitEnemy: function() { playTone(220, 90, 0.12, 'square', 0.09); },
    hurt: function() { playTone(190, 65, 0.25, 'sawtooth', 0.11); },
    bossRoar: function() { playTone(130, 55, 0.38, 'sawtooth', 0.12); },
    win: function() {
      var notes = [523, 659, 784, 1046];
      for (var i = 0; i < notes.length; i++) {
        (function(n, idx) {
          setTimeout(function() { playTone(n, n, 0.16, 'square', 0.08); }, idx * 110);
        })(notes[i], i);
      }
    }
  };

  // Setup selectors
  pickDoge.onclick = function() {
    selectedHero = 'doge';
    pickDoge.className = 'sel-btn active-doge';
    pickPepe.className = 'sel-btn';
  };
  pickPepe.onclick = function() {
    selectedHero = 'pepe';
    pickPepe.className = 'sel-btn active-pepe';
    pickDoge.className = 'sel-btn';
  };

  function setDiff(d) {
    difficulty = d;
    diffEasy.className = 'sel-btn' + (d === 'easy' ? ' active-diff' : '');
    diffNormal.className = 'sel-btn' + (d === 'normal' ? ' active-diff' : '');
    diffHard.className = 'sel-btn' + (d === 'hard' ? ' active-diff' : '');
  }
  diffEasy.onclick = function() { setDiff('easy'); };
  diffNormal.onclick = function() { setDiff('normal'); };
  diffHard.onclick = function() { setDiff('hard'); };

  function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(x, y, w, h, r);
    } else {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  }

  var weapons = ['SWORD', 'BLASTER', 'FIRE'];
  var weaponIdx = 0;

  var gravity = 0.58;
  var player = {
    x: 90, y: 340, w: 34, h: 42,
    vx: 0, vy: 0, speed: 4.8, jumpPower: -12.2,
    grounded: false, jumpsLeft: 2, facing: 1,
    hp: 3, maxHp: 3, invuln: 0,
    dashTimer: 0, dashCooldown: 0,
    slashTimer: 0, atkCooldown: 0
  };
  var afterimages = [];

  // Block types: 'brick', 'q_coin', 'q_heal', 'empty', 'pipe'
  var blocks = [
    { x: 240, y: 290, w: 40, h: 40, type: 'brick', bump: 0 },
    { x: 280, y: 290, w: 40, h: 40, type: 'q_coin', bump: 0 },
    { x: 320, y: 290, w: 40, h: 40, type: 'brick', bump: 0 },
    { x: 360, y: 290, w: 40, h: 40, type: 'q_heal', bump: 0 },
    { x: 400, y: 290, w: 40, h: 40, type: 'brick', bump: 0 },
    { x: 320, y: 165, w: 40, h: 40, type: 'q_coin', bump: 0 },

    { x: 540, y: 350, w: 56, h: 80, type: 'pipe', bump: 0 },
    { x: 740, y: 310, w: 56, h: 120, type: 'pipe', bump: 0 },

    { x: 920, y: 280, w: 40, h: 40, type: 'q_coin', bump: 0 },
    { x: 960, y: 280, w: 40, h: 40, type: 'brick', bump: 0 },
    { x: 1000, y: 280, w: 40, h: 40, type: 'q_coin', bump: 0 },
    { x: 1120, y: 195, w: 40, h: 40, type: 'brick', bump: 0 },
    { x: 1160, y: 195, w: 40, h: 40, type: 'q_heal', bump: 0 },
    { x: 1200, y: 195, w: 40, h: 40, type: 'brick', bump: 0 },

    { x: 1420, y: 330, w: 56, h: 100, type: 'pipe', bump: 0 },
    { x: 1600, y: 280, w: 40, h: 40, type: 'q_coin', bump: 0 },
    { x: 1640, y: 280, w: 40, h: 40, type: 'q_heal', bump: 0 },
    { x: 1680, y: 280, w: 40, h: 40, type: 'q_coin', bump: 0 }
  ];
  for (var i = 0; i < blocks.length; i++) blocks[i].origType = blocks[i].type;

  var initialEnemies = [
    { x: 460, y: 394, w: 34, h: 36, vx: -1.5, alive: true, minX: 380, maxX: 530, kind: 'walker', hp: 1 },
    { x: 660, y: 394, w: 34, h: 36, vx: 1.6, alive: true, minX: 605, maxX: 730, kind: 'walker', hp: 1 },
    { x: 840, y: 240, w: 36, h: 28, vx: 1.8, alive: true, minX: 760, maxX: 1050, kind: 'flyer', baseY: 240, hp: 1 },
    { x: 1060, y: 394, w: 34, h: 36, vx: -1.8, alive: true, minX: 830, maxX: 1380, kind: 'walker', hp: 1 },
    { x: 1300, y: 210, w: 36, h: 28, vx: -2.0, alive: true, minX: 1120, maxX: 1440, kind: 'flyer', baseY: 210, hp: 1 },
    { x: 1560, y: 394, w: 34, h: 36, vx: -1.9, alive: true, minX: 1485, maxX: 1840, kind: 'walker', hp: 1 }
  ];

  var enemies = [];
  var projectiles = [];
  var bossShots = [];
  var particles = [];
  var floatingCoins = [];

  var arenaStartX = 1900;
  var arenaLeftWall = 1900;
  var arenaRightWall = 2680;
  var bossActive = false;
  var boss = null;

  function resetGame() {
    var diffMult = difficulty === 'easy' ? 0.8 : (difficulty === 'hard' ? 1.35 : 1.0);
    player.maxHp = difficulty === 'easy' ? 5 : (difficulty === 'hard' ? 2 : 3);
    player.hp = player.maxHp;
    player.x = 90; player.y = 340; player.vx = 0; player.vy = 0;
    player.jumpsLeft = 2; player.invuln = 0;
    player.dashTimer = 0; player.dashCooldown = 0;
    player.slashTimer = 0; player.atkCooldown = 0;
    weaponIdx = 0;

    camX = 0; score = 0; coins = 0;
    afterimages = []; projectiles = []; bossShots = []; particles = []; floatingCoins = [];

    enemies = JSON.parse(JSON.stringify(initialEnemies));
    for (var e = 0; e < enemies.length; e++) {
      enemies[e].vx *= diffMult;
      if (difficulty === 'hard') enemies[e].hp = 2;
    }

    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].origType) blocks[i].type = blocks[i].origType;
    }

    bossActive = false;
    var bHp = difficulty === 'easy' ? 14 : (difficulty === 'hard' ? 28 : 20);
    boss = {
      x: 2480, y: 310, w: 92, h: 120,
      vx: -2.2 * diffMult, vy: 0,
      hp: bHp, maxHp: bHp,
      alive: true, hurtTimer: 0,
      attackTimer: 70, jumpTimer: 130, facing: -1
    };
  }

  startBtn.onclick = function() {
    initAudio();
    var val = nameInput.value.trim();
    playerName = val ? val.toUpperCase() : 'PLAYER 1';
    resetGame();
    overlay.style.display = 'none';
    mode = 'play';
    requestAnimationFrame(loop);
  };

  window.addEventListener('keydown', function(e) {
    if (document.activeElement === nameInput) return;
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) !== -1) e.preventDefault();
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') doJump();
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyE') doDash();
    if (e.code === 'KeyF' || e.code === 'KeyZ' || e.code === 'KeyX') doAttack();
    if (e.code === 'KeyQ' || e.code === 'KeyC') switchWeapon();
  });
  window.addEventListener('keyup', function(e) { keys[e.code] = false; });

  function bindBtn(el, onDown, onUp) {
    el.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      initAudio();
      onDown();
    });
    if (onUp) {
      el.addEventListener('pointerup', function(e) { e.preventDefault(); onUp(); });
      el.addEventListener('pointercancel', function(e) { e.preventDefault(); onUp(); });
      el.addEventListener('pointerleave', function(e) { e.preventDefault(); onUp(); });
    }
  }

  var tbtns = document.querySelectorAll('.tbtn[data-key]');
  for (var b = 0; b < tbtns.length; b++) {
    (function(btn) {
      var code = btn.getAttribute('data-key');
      bindBtn(btn, function() { keys[code] = true; }, function() { keys[code] = false; });
    })(tbtns[b]);
  }

  bindBtn(document.getElementById('btn-dash'), doDash);
  bindBtn(document.getElementById('btn-wpn'), switchWeapon);
  bindBtn(document.getElementById('btn-atk'), doAttack);
  bindBtn(document.getElementById('btn-jump'), doJump);

  function switchWeapon() {
    if (mode !== 'play') return;
    weaponIdx = (weaponIdx + 1) % weapons.length;
    playTone(660, 880, 0.08, 'triangle', 0.06);
  }

  function doJump() {
    if (mode !== 'play') return;
    if (player.grounded) {
      player.vy = player.jumpPower;
      player.grounded = false;
      player.jumpsLeft = 1;
      sfx.jump();
      spawnParticles(player.x + player.w / 2, player.y + player.h, '#ffffff', 7);
    } else if (player.jumpsLeft > 0) {
      player.vy = player.jumpPower * 0.92;
      player.jumpsLeft = 0;
      sfx.djump();
      spawnParticles(player.x + player.w / 2, player.y + player.h, '#38bdf8', 12);
    }
  }

  function doDash() {
    if (mode !== 'play') return;
    if (player.dashCooldown <= 0 && player.dashTimer <= 0) {
      player.dashTimer = 11;
      player.dashCooldown = 38;
      player.vy = 0;
      sfx.dash();
      spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#38bdf8', 10);
    }
  }

  function doAttack() {
    if (mode !== 'play' || player.atkCooldown > 0) return;
    var wpn = weapons[weaponIdx];

    if (wpn === 'SWORD') {
      player.slashTimer = 12;
      player.atkCooldown = 18;
      sfx.sword();
      var slashBox = {
        x: player.facing === 1 ? player.x + player.w - 4 : player.x - 46,
        y: player.y - 4,
        w: 50,
        h: player.h + 10
      };
      // Hit enemies
      for (var e = 0; e < enemies.length; e++) {
        var en = enemies[e];
        if (en.alive && rectIntersect(slashBox, en)) {
          damageEnemy(en, 2, player.facing * 5);
        }
      }
      // Hit boss
      if (bossActive && boss && boss.alive && rectIntersect(slashBox, boss)) {
        damageBoss(2);
      }
      // Deflect/destroy boss projectiles
      for (var bs = bossShots.length - 1; bs >= 0; bs--) {
        var s = bossShots[bs];
        if (s.x > slashBox.x && s.x < slashBox.x + slashBox.w && s.y > slashBox.y && s.y < slashBox.y + slashBox.h) {
          spawnParticles(s.x, s.y, '#38bdf8', 8);
          bossShots.splice(bs, 1);
          score += 50;
        }
      }

    } else if (wpn === 'BLASTER') {
      player.atkCooldown = 14;
      sfx.blaster();
      projectiles.push({
        kind: 'blaster',
        x: player.facing === 1 ? player.x + player.w + 4 : player.x - 14,
        y: player.y + 18,
        vx: player.facing * 11,
        vy: 0,
        dmg: 1,
        life: 65
      });

    } else if (wpn === 'FIRE') {
      player.atkCooldown = 20;
      sfx.fire();
      projectiles.push({
        kind: 'fire',
        x: player.facing === 1 ? player.x + player.w : player.x - 10,
        y: player.y + 18,
        vx: player.facing * 7.8,
        vy: 2,
        dmg: 1.5,
        life: 95
      });
    }
  }

  function damageEnemy(en, dmg, knockX) {
    en.hp -= dmg;
    en.x += (knockX || 0);
    if (en.hp <= 0) {
      en.alive = false;
      score += 300;
      sfx.hitEnemy();
      spawnParticles(en.x + en.w / 2, en.y + en.h / 2, '#ef4444', 14);
    } else {
      sfx.hitEnemy();
      spawnParticles(en.x + en.w / 2, en.y + en.h / 2, '#facc15', 6);
    }
  }

  function damageBoss(dmg) {
    if (!boss || !boss.alive || boss.hurtTimer > 0) return;
    boss.hp -= dmg;
    boss.hurtTimer = 10;
    score += 150;
    sfx.hitEnemy();
    spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, '#facc15', 12);
    if (boss.hp <= 0) {
      boss.hp = 0;
      boss.alive = false;
      bossShots = [];
      score += 2500;
      sfx.win();
      for (var k = 0; k < 5; k++) {
        spawnParticles(boss.x + Math.random() * boss.w, boss.y + Math.random() * boss.h, k % 2 === 0 ? '#facc15' : '#4ade80', 18);
      }
      setTimeout(function() {
        endGame('VICTORY! BOSS DEFEATED BY ' + playerName + '!');
      }, 950);
    }
  }

  function hurtPlayer() {
    if (player.invuln > 0 || player.dashTimer > 0) return;
    player.hp--;
    player.invuln = 65;
    player.vy = -7;
    sfx.hurt();
    spawnParticles(player.x + 17, player.y + 20, '#ef4444', 14);
    if (player.hp <= 0) {
      endGame('GAME OVER! TRY AGAIN?');
    }
  }

  function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 6.5,
        vy: -Math.random() * 6.5 - 1,
        color: color,
        life: 22 + Math.random() * 14
      });
    }
  }

  function rectIntersect(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    frame++;
    if (player.invuln > 0) player.invuln--;
    if (player.dashCooldown > 0) player.dashCooldown--;
    if (player.slashTimer > 0) player.slashTimer--;
    if (player.atkCooldown > 0) player.atkCooldown--;

    // Dash vs Normal Movement
    if (player.dashTimer > 0) {
      player.dashTimer--;
      player.vx = player.facing * 12.5;
      player.vy = 0;
      if (frame % 2 === 0) {
        afterimages.push({ x: player.x, y: player.y, facing: player.facing, life: 12 });
      }
    } else {
      if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -player.speed;
        player.facing = -1;
      } else if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = player.speed;
        player.facing = 1;
      } else {
        player.vx *= 0.78;
        if (Math.abs(player.vx) < 0.2) player.vx = 0;
      }
      player.vy += gravity;
    }

    player.x += player.vx;
    var minBound = bossActive ? arenaLeftWall + 6 : 10;
    var maxBound = bossActive ? arenaRightWall - player.w - 6 : arenaRightWall - player.w;
    if (player.x < minBound) player.x = minBound;
    if (player.x > maxBound) player.x = maxBound;

    // Horizontal block collision
    for (var i = 0; i < blocks.length; i++) {
      var blk = blocks[i];
      if (rectIntersect(player, blk)) {
        if (player.vx > 0) player.x = blk.x - player.w;
        else if (player.vx < 0) player.x = blk.x + blk.w;
      }
    }

    player.y += player.vy;
    player.grounded = false;

    if (player.y + player.h >= 430) {
      player.y = 430 - player.h;
      player.vy = 0;
      player.grounded = true;
      player.jumpsLeft = 2;
    }

    for (var i = 0; i < blocks.length; i++) {
      var blk = blocks[i];
      if (blk.bump > 0) blk.bump -= 1.5;
      if (rectIntersect(player, blk)) {
        if (player.vy > 0) {
          player.y = blk.y - player.h;
          player.vy = 0;
          player.grounded = true;
          player.jumpsLeft = 2;
        } else if (player.vy < 0) {
          player.y = blk.y + blk.h;
          player.vy = 1.5;
          blk.bump = 9;
          if (blk.type === 'q_coin') {
            blk.type = 'empty';
            coins++; score += 200;
            sfx.coin();
            floatingCoins.push({ x: blk.x + 20, y: blk.y - 10, vy: -7, life: 26 });
            spawnParticles(blk.x + 20, blk.y, '#facc15', 10);
          } else if (blk.type === 'q_heal') {
            blk.type = 'empty';
            player.hp = Math.min(player.maxHp, player.hp + 1);
            score += 400;
            sfx.heal();
            spawnParticles(blk.x + 20, blk.y, '#f43f5e', 16);
          } else if (blk.type === 'brick') {
            score += 50;
            sfx.hitEnemy();
            spawnParticles(blk.x + 20, blk.y + 20, '#d97706', 8);
          }
        }
      }
    }

    // Trigger Boss Arena
    if (!bossActive && player.x >= arenaStartX + 40) {
      bossActive = true;
      sfx.bossRoar();
    }

    // Enemies update
    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (!en.alive) continue;
      en.x += en.vx;
      if (en.x <= en.minX || en.x + en.w >= en.maxX) en.vx *= -1;
      if (en.kind === 'flyer') {
        en.y = en.baseY + Math.sin(frame * 0.08 + e) * 26;
      }

      if (rectIntersect(player, en)) {
        if (player.vy > 0 && player.y + player.h - player.vy <= en.y + 16) {
          player.vy = -9.5;
          player.jumpsLeft = 2;
          damageEnemy(en, 2, 0);
        } else {
          hurtPlayer();
        }
      }
    }

    // Boss AI Update
    if (bossActive && boss && boss.alive) {
      if (boss.hurtTimer > 0) boss.hurtTimer--;
      boss.facing = player.x < boss.x + boss.w / 2 ? -1 : 1;

      boss.x += boss.vx;
      if (boss.x <= arenaLeftWall + 14) { boss.x = arenaLeftWall + 14; boss.vx = Math.abs(boss.vx); }
      if (boss.x + boss.w >= arenaRightWall - 14) { boss.x = arenaRightWall - 14 - boss.w; boss.vx = -Math.abs(boss.vx); }

      // Boss Jump
      boss.jumpTimer--;
      if (boss.jumpTimer <= 0 && boss.y + boss.h >= 430) {
        boss.vy = -12.5;
        boss.vx = boss.facing * (difficulty === 'hard' ? 4.2 : 3.0);
        boss.jumpTimer = difficulty === 'hard' ? 95 : 135;
        sfx.bossRoar();
      }
      boss.vy += gravity;
      boss.y += boss.vy;
      if (boss.y + boss.h >= 430) {
        boss.y = 430 - boss.h;
        boss.vy = 0;
      }

      // Boss Ranged Attack
      boss.attackTimer--;
      if (boss.attackTimer <= 0) {
        boss.attackTimer = difficulty === 'hard' ? 55 : (difficulty === 'easy' ? 95 : 75);
        var angle = Math.atan2((player.y + 20) - (boss.y + 50), (player.x + 17) - (boss.x + boss.w / 2));
        var spd = difficulty === 'hard' ? 6.5 : 5.0;
        bossShots.push({
          x: boss.x + boss.w / 2,
          y: boss.y + 50,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 140
        });
        sfx.fire();
      }

      // Player vs Boss contact
      if (rectIntersect(player, boss)) {
        if (player.vy > 0 && player.y + player.h - player.vy <= boss.y + 22) {
          player.vy = -10.5;
          player.jumpsLeft = 2;
          damageBoss(2);
        } else {
          hurtPlayer();
        }
      }
    }

    // Player Projectiles Update
    for (var f = projectiles.length - 1; f >= 0; f--) {
      var fb = projectiles[f];
      fb.x += fb.vx;
      if (fb.kind === 'fire') {
        fb.vy += 0.45;
        fb.y += fb.vy;
        if (fb.y >= 420) { fb.y = 420; fb.vy = -6.5; }
      }
      fb.life--;

      var hitWall = false;
      for (var b = 0; b < blocks.length; b++) {
        if (fb.x > blocks[b].x && fb.x < blocks[b].x + blocks[b].w && fb.y > blocks[b].y && fb.y < blocks[b].y + blocks[b].h) {
          hitWall = true; break;
        }
      }
      for (var e = 0; e < enemies.length; e++) {
        var en = enemies[e];
        if (en.alive && fb.x > en.x && fb.x < en.x + en.w && fb.y > en.y && fb.y < en.y + en.h) {
          damageEnemy(en, fb.dmg, fb.vx > 0 ? 4 : -4);
          hitWall = true;
          break;
        }
      }
      if (!hitWall && bossActive && boss && boss.alive && fb.x > boss.x && fb.x < boss.x + boss.w && fb.y > boss.y && fb.y < boss.y + boss.h) {
        damageBoss(fb.dmg);
        hitWall = true;
      }

      if (hitWall || fb.life <= 0) {
        spawnParticles(fb.x, fb.y, fb.kind === 'blaster' ? '#38bdf8' : '#facc15', 5);
        projectiles.splice(f, 1);
      }
    }

    // Boss Shots Update
    for (var bs = bossShots.length - 1; bs >= 0; bs--) {
      var s = bossShots[bs];
      s.x += s.vx;
      s.y += s.vy;
      s.life--;
      if (s.x > player.x && s.x < player.x + player.w && s.y > player.y && s.y < player.y + player.h) {
        hurtPlayer();
        bossShots.splice(bs, 1);
        continue;
      }
      if (s.life <= 0 || s.y > 430) bossShots.splice(bs, 1);
    }

    // Particles, Coins & Afterimages
    for (var a = afterimages.length - 1; a >= 0; a--) {
      afterimages[a].life--;
      if (afterimages[a].life <= 0) afterimages.splice(a, 1);
    }
    for (var p = particles.length - 1; p >= 0; p--) {
      particles[p].x += particles[p].vx;
      particles[p].y += particles[p].vy;
      particles[p].vy += 0.25;
      particles[p].life--;
      if (particles[p].life <= 0) particles.splice(p, 1);
    }
    for (var c = floatingCoins.length - 1; c >= 0; c--) {
      floatingCoins[c].y += floatingCoins[c].vy;
      floatingCoins[c].vy += 0.4;
      floatingCoins[c].life--;
      if (floatingCoins[c].life <= 0) floatingCoins.splice(c, 1);
    }

    // Camera Follow or Lock in Boss Arena
    if (bossActive) {
      var targetCam = arenaLeftWall - 10;
      camX += (targetCam - camX) * 0.12;
    } else {
      camX = Math.max(0, player.x - 240);
    }
  }

  function endGame(msg) {
    mode = 'over';
    overlay.querySelector('h1').textContent = 'SUPERBROS';
    overlay.querySelector('.byline').textContent = msg + ' | SCORE: ' + score;
    startBtn.textContent = 'PLAY AGAIN';
    overlay.style.display = 'flex';
  }

  function drawBackground() {
    var sky = ctx.createLinearGradient(0, 0, 0, 430);
    sky.addColorStop(0, '#0284c7');
    sky.addColorStop(0.6, '#38bdf8');
    sky.addColorStop(1, '#bae6fd');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, 430);

    ctx.fillStyle = 'rgba(254, 240, 138, 0.35)';
    ctx.beginPath(); ctx.arc(680, 75, 52, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fef08a';
    ctx.beginPath(); ctx.arc(680, 75, 32, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#0ea5e9';
    for (var h = -1; h < 10; h++) {
      var hx = h * 340 - (camX * 0.2) % 340;
      ctx.beginPath();
      ctx.moveTo(hx, 430);
      ctx.quadraticCurveTo(hx + 170, 230, hx + 340, 430);
      ctx.fill();
    }

    for (var g = -1; g < 10; g++) {
      var gx = g * 380 - (camX * 0.45) % 380;
      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.moveTo(gx, 430);
      ctx.quadraticCurveTo(gx + 190, 290, gx + 380, 430);
      ctx.fill();
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    for (var c = 0; c < 12; c++) {
      var cx = (c * 280 - (camX * 0.3)) % 3360;
      if (cx < -120) cx += 3360;
      var cy = 65 + (c % 3) * 35;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI * 2);
      ctx.arc(cx + 22, cy - 8, 26, 0, Math.PI * 2);
      ctx.arc(cx + 46, cy, 20, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround() {
    ctx.fillStyle = '#78350f';
    ctx.fillRect(0, 430, W, 70);

    ctx.strokeStyle = '#451a03';
    ctx.lineWidth = 2;
    var offset = -(camX % 40);
    for (var x = offset; x < W; x += 40) {
      ctx.strokeRect(x, 444, 40, 28);
      ctx.strokeRect(x - 20, 472, 40, 28);
    }

    var grassGrad = ctx.createLinearGradient(0, 430, 0, 446);
    grassGrad.addColorStop(0, '#4ade80');
    grassGrad.addColorStop(0.5, '#22c55e');
    grassGrad.addColorStop(1, '#15803d');
    ctx.fillStyle = grassGrad;
    ctx.fillRect(0, 430, W, 16);
    ctx.fillStyle = '#14532d';
    ctx.fillRect(0, 445, W, 2);
  }

  function drawBlocks() {
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      var bx = Math.round(b.x - camX);
      var by = Math.round(b.y - b.bump);
      if (bx + b.w < -50 || bx > W + 50) continue;

      if (b.type === 'brick') {
        var grad = ctx.createLinearGradient(bx, by, bx, by + b.h);
        grad.addColorStop(0, '#ea580c');
        grad.addColorStop(1, '#9a3412');
        ctx.fillStyle = grad;
        ctx.fillRect(bx, by, b.w, b.h);

        ctx.strokeStyle = '#431407';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx + 1, by + 1, b.w - 2, b.h - 2);

        ctx.beginPath();
        ctx.moveTo(bx, by + 20); ctx.lineTo(bx + b.w, by + 20);
        ctx.moveTo(bx + 20, by); ctx.lineTo(bx + 20, by + 20);
        ctx.moveTo(bx + 10, by + 20); ctx.lineTo(bx + 10, by + 40);
        ctx.moveTo(bx + 30, by + 20); ctx.lineTo(bx + 30, by + 40);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fillRect(bx + 2, by + 2, b.w - 4, 4);

      } else if (b.type === 'q_coin' || b.type === 'q_heal') {
        var isHeal = b.type === 'q_heal';
        var qGrad = ctx.createLinearGradient(bx, by, bx, by + b.h);
        if (isHeal) {
          qGrad.addColorStop(0, '#fda4af');
          qGrad.addColorStop(0.5, '#f43f5e');
          qGrad.addColorStop(1, '#be123c');
        } else {
          qGrad.addColorStop(0, '#fef08a');
          qGrad.addColorStop(0.5, '#facc15');
          qGrad.addColorStop(1, '#ca8a04');
        }
        ctx.fillStyle = qGrad;
        ctx.fillRect(bx, by, b.w, b.h);

        ctx.strokeStyle = isHeal ? '#881337' : '#713f12';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx + 1, by + 1, b.w - 2, b.h - 2);

        ctx.fillStyle = isHeal ? '#881337' : '#713f12';
        ctx.fillRect(bx + 4, by + 4, 3, 3);
        ctx.fillRect(bx + b.w - 7, by + 4, 3, 3);
        ctx.fillRect(bx + 4, by + b.h - 7, 3, 3);
        ctx.fillRect(bx + b.w - 7, by + b.h - 7, 3, 3);

        var sym = isHeal ? '♥' : '?';
        ctx.font = '900 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = isHeal ? '#881337' : '#713f12';
        ctx.fillText(sym, bx + b.w / 2 + 1.5, by + 28.5);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(sym, bx + b.w / 2, by + 27);
        ctx.textAlign = 'left';

      } else if (b.type === 'empty') {
        ctx.fillStyle = '#475569';
        ctx.fillRect(bx, by, b.w, b.h);
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx + 1, by + 1, b.w - 2, b.h - 2);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(bx + 4, by + 4, 3, 3);
        ctx.fillRect(bx + b.w - 7, by + 4, 3, 3);
        ctx.fillRect(bx + 4, by + b.h - 7, 3, 3);
        ctx.fillRect(bx + b.w - 7, by + b.h - 7, 3, 3);

      } else if (b.type === 'pipe') {
        var pGrad = ctx.createLinearGradient(bx, by, bx + b.w, by);
        pGrad.addColorStop(0, '#15803d');
        pGrad.addColorStop(0.3, '#4ade80');
        pGrad.addColorStop(0.7, '#22c55e');
        pGrad.addColorStop(1, '#14532d');

        ctx.fillStyle = pGrad;
        ctx.fillRect(bx + 4, by + 22, b.w - 8, b.h - 22);
        ctx.strokeStyle = '#052e16';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx + 4, by + 22, b.w - 8, b.h - 22);

        ctx.fillStyle = pGrad;
        ctx.fillRect(bx, by, b.w, 22);
        ctx.strokeRect(bx, by, b.w, 22);
      }
    }
  }

  function drawEnemies() {
    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (!en.alive) continue;
      var ex = Math.round(en.x - camX);
      var ey = Math.round(en.y);
      if (ex + en.w < -40 || ex > W + 40) continue;

      if (en.kind === 'flyer') {
        // Flying FUD Drone
        var wing = Math.sin(frame * 0.4) * 7;
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(ex + 2, ey - 4 + wing, 12, 6);
        ctx.fillRect(ex + 22, ey - 4 - wing, 12, 6);

        ctx.fillStyle = '#7e22ce';
        drawRoundRect(ex + 4, ey + 2, 28, 22, 8);
        ctx.fill();
        ctx.strokeStyle = '#3b0764';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#facc15';
        ctx.fillRect(ex + 9, ey + 9, 5, 5);
        ctx.fillRect(ex + 22, ey + 9, 5, 5);
      } else {
        var bounce = Math.abs(Math.sin(frame * 0.15 + e)) * 3;
        ctx.fillStyle = '#991b1b';
        ctx.beginPath();
        ctx.arc(ex + en.w / 2, ey + en.h / 2 + 2 - bounce, 16, Math.PI, 0);
        ctx.lineTo(ex + en.w, ey + en.h - 4);
        ctx.lineTo(ex, ey + en.h - 4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#450a0a';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fef08a';
        ctx.fillRect(ex + 7, ey + 14 - bounce, 6, 6);
        ctx.fillRect(ex + 21, ey + 14 - bounce, 6, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(ex + 9, ey + 16 - bounce, 3, 3);
        ctx.fillRect(ex + 22, ey + 16 - bounce, 3, 3);

        var step = Math.sin(frame * 0.25) * 3;
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(ex + 4 + step, ey + en.h - 5, 10, 5);
        ctx.fillRect(ex + 20 - step, ey + en.h - 5, 10, 5);
      }
    }
  }

  function drawBoss() {
    if (!boss || !boss.alive) return;
    var bx = Math.round(boss.x - camX);
    var by = Math.round(boss.y);
    if (bx > W + 120) return;

    // Arena Energy Barrier when locked
    if (bossActive) {
      var wallX = Math.round(arenaLeftWall - camX);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
      ctx.fillRect(wallX, 0, 8, 430);
    }

    if (boss.hurtTimer > 0 && frame % 2 === 0) {
      ctx.fillStyle = '#ffffff';
      drawRoundRect(bx, by, boss.w, boss.h, 16);
      ctx.fill();
      return;
    }

    // Mega FUD Dragon / Cyber Bear Boss
    var breath = Math.sin(frame * 0.1) * 3;
    ctx.fillStyle = '#7f1d1d';
    drawRoundRect(bx + 6, by + 16 + breath, boss.w - 12, boss.h - 24, 18);
    ctx.fill();
    ctx.strokeStyle = '#fca5a5';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Armor Belly Plate
    ctx.fillStyle = '#450a0a';
    drawRoundRect(bx + 20, by + 44 + breath, boss.w - 40, 52, 10);
    ctx.fill();

    // Horns
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.moveTo(bx + 18, by + 20 + breath);
    ctx.lineTo(bx + 6, by - 4 + breath);
    ctx.lineTo(bx + 32, by + 16 + breath);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(bx + boss.w - 18, by + 20 + breath);
    ctx.lineTo(bx + boss.w - 6, by - 4 + breath);
    ctx.lineTo(bx + boss.w - 32, by + 16 + breath);
    ctx.fill();

    // Glowing Angry Eyes
    var eyeShift = boss.facing === -1 ? -6 : 6;
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(bx + 24 + eyeShift, by + 30 + breath, 14, 10);
    ctx.fillRect(bx + 54 + eyeShift, by + 30 + breath, 14, 10);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(bx + 28 + eyeShift, by + 32 + breath, 6, 6);
    ctx.fillRect(bx + 58 + eyeShift, by + 32 + breath, 6, 6);

    // Boss HP Bar
    if (bossActive) {
      var barW = 280;
      var barX = W / 2 - barW / 2;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      drawRoundRect(barX - 4, 46, barW + 8, 22, 8);
      ctx.fill();
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(barX, 50, barW * (boss.hp / boss.maxHp), 14);
      ctx.font = '900 10px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText('MEGA FUD BOSS: ' + Math.ceil(boss.hp) + ' / ' + boss.maxHp, W / 2, 61);
      ctx.textAlign = 'left';
    }
  }

  function drawPlayer() {
    // Dash Afterimages
    for (var a = 0; a < afterimages.length; a++) {
      var ai = afterimages[a];
      ctx.fillStyle = 'rgba(56, 189, 248, ' + (ai.life / 24) + ')';
      drawRoundRect(Math.round(ai.x - camX), Math.round(ai.y), player.w, player.h, 8);
      ctx.fill();
    }

    if (player.invuln > 0 && Math.floor(frame / 4) % 2 === 0) return;

    var px = Math.round(player.x - camX);
    var py = Math.round(player.y);

    // Floating Custom Player Name Tag
    ctx.font = '900 11px sans-serif';
    ctx.textAlign = 'center';
    var nameW = ctx.measureText(playerName).width + 12;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
    drawRoundRect(px + player.w / 2 - nameW / 2, py - 24, nameW, 16, 6);
    ctx.fill();
    ctx.fillStyle = selectedHero === 'pepe' ? '#4ade80' : '#fef08a';
    ctx.fillText(playerName, px + player.w / 2, py - 12);
    ctx.textAlign = 'left';

    var runOffset = (Math.abs(player.vx) > 0.5 && player.grounded) ? Math.sin(frame * 0.35) * 3 : 0;

    if (selectedHero === 'pepe') {
      ctx.fillStyle = '#1e40af';
      ctx.fillRect(px + 6 + runOffset, py + 30, 8, 12);
      ctx.fillRect(px + 20 - runOffset, py + 30, 8, 12);

      ctx.fillStyle = '#2563eb';
      ctx.fillRect(px + 5, py + 18, 24, 14);

      ctx.fillStyle = '#4ade80';
      drawRoundRect(px + 3, py + 4, 28, 17, 7);
      ctx.fill();
      ctx.strokeStyle = '#14532d';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(px + 11, py + 4, 6, 0, Math.PI * 2);
      ctx.arc(px + 23, py + 4, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px + 11, py + 4, 4, 0, Math.PI * 2);
      ctx.arc(px + 23, py + 4, 4, 0, Math.PI * 2);
      ctx.fill();

      var pupilShift = player.facing === 1 ? 1.5 : -1.5;
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(px + 11 + pupilShift, py + 4, 2, 0, Math.PI * 2);
      ctx.arc(px + 23 + pupilShift, py + 4, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#dc2626';
      var lipX = player.facing === 1 ? px + 11 : px + 4;
      drawRoundRect(lipX, py + 13, 18, 5, 2.5);
      ctx.fill();

    } else {
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(px + 6 + runOffset, py + 30, 8, 12);
      ctx.fillRect(px + 20 - runOffset, py + 30, 8, 12);

      ctx.fillStyle = '#2563eb';
      ctx.fillRect(px + 5, py + 18, 24, 15);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(px + 9, py + 22, 4, 4);
      ctx.fillRect(px + 21, py + 22, 4, 4);

      ctx.fillStyle = '#f59e0b';
      drawRoundRect(px + 4, py + 2, 26, 20, 7);
      ctx.fill();
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#fef3c7';
      var snoutX = player.facing === 1 ? px + 16 : px + 4;
      ctx.fillRect(snoutX, py + 11, 13, 8);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(player.facing === 1 ? px + 26 : px + 4, py + 11, 3, 3);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(player.facing === 1 ? px + 20 : px + 10, py + 7, 3, 4);

      ctx.fillStyle = '#dc2626';
      ctx.fillRect(px + 4, py - 1, 26, 5);
      ctx.fillRect(player.facing === 1 ? px + 14 : px, py + 2, 20, 3);
    }

    // Equipped Weapon Visuals
    var wpn = weapons[weaponIdx];
    if (wpn === 'SWORD') {
      ctx.save();
      ctx.translate(px + player.w / 2, py + 24);
      if (player.facing === -1) ctx.scale(-1, 1);
      var swing = player.slashTimer > 0 ? (12 - player.slashTimer) * 0.18 : -0.35;
      ctx.rotate(swing);
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(8, -3, 24, 5);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(10, -2, 22, 3);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(6, -6, 4, 11);
      ctx.restore();

      if (player.slashTimer > 0) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        if (player.facing === 1) ctx.arc(px + 26, py + 22, 32, -0.9, 0.9);
        else ctx.arc(px + 8, py + 22, 32, Math.PI - 0.9, Math.PI + 0.9);
        ctx.stroke();
      }
    } else if (wpn === 'BLASTER') {
      ctx.fillStyle = '#334155';
      var gx = player.facing === 1 ? px + 24 : px - 6;
      ctx.fillRect(gx, py + 20, 16, 7);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.facing === 1 ? gx + 12 : gx, py + 21, 4, 4);
    }
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, 0, W, 36);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(0, 35, W, 1.5);

    ctx.font = '900 13px sans-serif';
    ctx.fillStyle = selectedHero === 'pepe' ? '#4ade80' : '#38bdf8';
    ctx.fillText(playerName, 14, 23);

    // Hearts HP
    var hearts = '';
    for (var h = 0; h < player.maxHp; h++) hearts += h < player.hp ? '♥' : '♡';
    ctx.fillStyle = '#f43f5e';
    ctx.font = '900 16px sans-serif';
    ctx.fillText(hearts, 150, 24);

    // Active Weapon Pill
    ctx.font = '900 12px sans-serif';
    ctx.fillStyle = '#c084fc';
    ctx.fillText('WPN: ' + weapons[weaponIdx], 265, 23);

    // Dash Ready Status
    ctx.fillStyle = player.dashCooldown <= 0 ? '#38bdf8' : '#64748b';
    ctx.fillText(player.dashCooldown <= 0 ? 'DASH: OK' : 'DASH...', 400, 23);

    ctx.fillStyle = '#facc15';
    ctx.fillText('COINS: ' + coins, 495, 23);

    ctx.fillStyle = '#4ade80';
    ctx.fillText('SCORE: ' + score, 605, 23);
  }

  function render() {
    drawBackground();
    drawBlocks();
    drawGround();
    drawEnemies();
    drawBoss();
    drawPlayer();

    // Player Projectiles
    for (var f = 0; f < projectiles.length; f++) {
      var fb = projectiles[f];
      if (fb.kind === 'blaster') {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(fb.x - camX - 8, fb.y - 3, 18, 6);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(fb.x - camX - 4, fb.y - 1.5, 10, 3);
      } else {
        ctx.fillStyle = selectedHero === 'pepe' ? '#22c55e' : '#f97316';
        ctx.beginPath(); ctx.arc(fb.x - camX, fb.y, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(fb.x - camX, fb.y, 3.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Boss Projectiles
    for (var bs = 0; bs < bossShots.length; bs++) {
      var s = bossShots[bs];
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(s.x - camX, s.y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(s.x - camX, s.y, 4, 0, Math.PI * 2); ctx.fill();
    }

    // Floating Coins
    for (var c = 0; c < floatingCoins.length; c++) {
      var fc = floatingCoins[c];
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.ellipse(fc.x - camX, fc.y, 7, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#854d0e';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Particles
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - camX, pt.y, 4, 4);
    }

    drawHUD();
  }

  function loop() {
    if (mode !== 'play') return;
    update();
    render();
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
