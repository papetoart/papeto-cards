<html lang="en">
<head>

<style>

  body {
    background: #09090b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    touch-action: none;
  }
  #card-frame {
    position: relative;
    width: 100vw;
    max-width: 800px;
    aspect-ratio: 16 / 10;
    border: 3px solid #eab308;
    box-shadow: 0 0 32px rgba(234, 179, 8, 0.5);
    background: #000;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #sig-badge {
    position: absolute;
    top: 6px;
    right: 8px;
    background: rgba(9, 9, 11, 0.85);
    border: 1px solid #eab308;
    color: #facc15;
    font-size: clamp(9px, 1.5vw, 12px);
    font-weight: bold;
    padding: 2px 8px;
    letter-spacing: 1px;
    z-index: 4;
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(30, 15, 10, 0.93), rgba(9, 9, 11, 0.97));
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #fff;
    padding: 14px;
    z-index: 20;
  }
  #overlay h1 {
    font-size: clamp(24px, 5vw, 44px);
    color: #eab308;
    text-shadow: 3px 3px 0 #991b1b, 0 0 18px rgba(234, 179, 8, 0.6);
    letter-spacing: 3px;
    margin-bottom: 4px;
  }
  .byline {
    font-size: clamp(10px, 1.8vw, 14px);
    color: #fef08a;
    letter-spacing: 2px;
    margin-bottom: 10px;
    font-weight: bold;
  }
  #overlay p {
    font-size: clamp(10px, 1.8vw, 13px);
    color: #d4d4d8;
    margin-bottom: 12px;
    max-width: 520px;
    line-height: 1.4;
  }
  .mode-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .mode-btn {
    background: #18181b;
    color: #a1a1aa;
    border: 2px solid #52525b;
    padding: 6px 14px;
    font-size: clamp(11px, 1.8vw, 14px);
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
  }
  .mode-btn.active {
    background: #14532d;
    color: #4ade80;
    border-color: #4ade80;
  }
  .mode-btn.norm.active {
    background: #713f12;
    color: #facc15;
    border-color: #facc15;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .action-btn {
    background: #eab308;
    color: #09090b;
    border: 2px solid #fef08a;
    padding: 10px 24px;
    font-size: clamp(13px, 2.2vw, 17px);
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 0 #713f12;
    text-transform: uppercase;
  }
  .action-btn:hover { background: #facc15; }
  .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #713f12; }
  #cont-btn {
    background: #22c55e;
    border-color: #bbf7d0;
    box-shadow: 0 4px 0 #14532d;
    display: none;
  }
  .touch-controls {
    position: absolute;
    bottom: 20%;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 12px;
    pointer-events: none;
    z-index: 5;
  }
  .pad-group { pointer-events: auto; display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; }
  .tbtn {
    width: 40px;
    height: 40px;
    background: rgba(9, 9, 11, 0.45);
    border: 1px solid rgba(234, 179, 8, 0.7);
    color: #fef08a;
    font-weight: bold;
    font-size: 13px;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .tbtn:active { background: rgba(234, 179, 8, 0.6); }
  #btn-fire {
    pointer-events: auto;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: rgba(220, 38, 38, 0.55);
    border: 2px solid #f87171;
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    align-self: center;
    cursor: pointer;
  }
  @media (min-width: 820px) and (pointer: fine) {
    .touch-controls { opacity: 0.35; }
    .touch-controls:hover { opacity: 0.95; }

  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !audioCtx) audioCtx = new AC();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function beep(f1, f2, dur, type, vol) {
    if (!audioCtx) return;
    type = type || 'square';
    vol = vol || 0.14;
    try {
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, now);
      if (f2) osc.frequency.exponentialRampToValueAtTime(f2, now + dur);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.005, now + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + dur);
    } catch (e) {}
  }

  // --- 64x64 TEXTURES ---

  function loadLevel(idx, keepScore) {
    lvlIdx = idx;
    if (idx > savedStage) {

    } else {
      var spots = [
        { x: 4.5, y: 2.5 }, { x: 4.5, y: 5.5 }, { x: 7.5, y: 2.5 },
        { x: 8.5, y: 5.5 }, { x: 9.5, y: 7.5 }, { x: 11.5, y: 8.5 },
        { x: 11.5, y: 2.5 }
      ];
      var count = Math.min(spots.length, 3 + Math.floor(idx / 2));
      for (var i = 0; i < count; i++) {
        var isBear = (i % 2 === 1 && idx >= 1);
        var eHp = isBear ? 3 : 2;
        enemies.push({
          x: spots[i].x, y: spots[i].y,
          type: isBear ? 'bear' : 'fud',
          hp: eHp, maxHp: eHp, alive: true, hurt: 0, atkCD: 1.2 + Math.random()
        });
      }
    }

    items = [
      { x: 3.5, y: 1.5, type: 'coin', got: false },
      { x: 6.5, y: 5.5, type: 'bone', got: false },
      { x: 11.5, y: 2.5, type: 'coin', got: false },
      { x: 5.5, y: 8.5, type: 'bone', got: false }
    ];

    muzzle = 0;
    hurtFlash = 0;
    showMsg(SECTOR_NAMES[idx]);
  }

  function canWalk(nx, ny) {
    var pad = 0.24;
    var checks = [
      [nx - pad, ny - pad], [nx + pad, ny - pad],
      [nx - pad, ny + pad], [nx + pad, ny + pad]
    ];
    for (var i = 0; i < checks.length; i++) {
      var mx = Math.floor(checks[i][0]), my = Math.floor(checks[i][1]);
      if (my < 0 || my >= map.length || mx < 0 || mx >= map[0].length) return false;
      var cell = map[my][mx];
      if (cell > 0 && cell !== 9) return false;
    }
    return true;
  }

  function fireWeapon() {
    if (mode !== 'play' || muzzle > 0) return;
    if (ammo <= 0) {
      showMsg('OUT OF AMMO! GRAB DOGECOINS!');
      beep(140, 90, 0.1);
      return;
    }
    ammo--;
    muzzle = 0.14;
    beep(560, 110, 0.14, 'sawtooth', 0.18);

    var bestEnemy = null;
    var bestDist = 999;
    var dirX = Math.cos(pDir), dirY = Math.sin(pDir);

    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (!e.alive) continue;
      var dx = e.x - px, dy = e.y - py;
      var dist = Math.hypot(dx, dy);
      if (dist > 10) continue;
      var dot = (dx * dirX + dy * dirY) / dist;
      var angleDiff = Math.acos(Math.max(-1, Math.min(1, dot)));
      var hitCone = (e.type === 'boss' ? 0.28 : 0.22) + (difficulty === 'easy' ? 0.05 : 0);
      if (angleDiff < hitCone && dist < bestDist) {
        var blocked = false;
        for (var d = 0.3; d < dist; d += 0.2) {
          var wx = Math.floor(px + dirX * d);
          var wy = Math.floor(py + dirY * d);
          if (map[wy] && map[wy][wx] > 0 && map[wy][wx] !== 9) { blocked = true; break; }
        }
        if (!blocked) { bestDist = dist; bestEnemy = e; }
      }
    }

    if (bestEnemy) {
      var dmgDealt = (difficulty === 'easy') ? 2 : 1;
      bestEnemy.hp -= dmgDealt;
      bestEnemy.hurt = 0.16;
      if (bestEnemy.hp <= 0) {
        bestEnemy.alive = false;
        var pts = bestEnemy.type === 'boss' ? 5000 : (bestEnemy.type === 'bear' ? 300 : 150);
        score += pts;
        coolTimer = 50;
        showMsg(bestEnemy.type === 'boss' ? 'MEGA FUD EMPEROR DESTROYED! +5000' : 'MUCH WOW! +' + pts);
        beep(320, 80, 0.22, 'square', 0.16);
      } else {
        showMsg((bestEnemy.type === 'boss' ? 'EMPEROR HP: ' : 'ENEMY HP: ') + bestEnemy.hp);
      }
    }
  }

  // --- INPUTS ---
  window.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) !== -1) e.preventDefault();
    if (e.code === 'Space' || e.code === 'KeyX' || e.code === 'ControlLeft') fireWeapon();
  });
  window.addEventListener('keyup', function(e) { keys[e.code] = false; });
  canvas.addEventListener('mousedown', function() { initAudio(); fireWeapon(); });

  var tbtns = document.querySelectorAll('.tbtn');
  for (var b = 0; b < tbtns.length; b++) {
    (function(btn) {
      var code = btn.getAttribute('data-key');
      function down(e) { e.preventDefault(); initAudio(); keys[code] = true; }
      function up(e) { e.preventDefault(); keys[code] = false; }
      btn.addEventListener('touchstart', down, { passive: false });
      btn.addEventListener('touchend', up, { passive: false });
      btn.addEventListener('mousedown', down);
      btn.addEventListener('mouseup', up);
      btn.addEventListener('mouseleave', up);
    })(tbtns[b]);
  }

  var fireBtn = document.getElementById('btn-fire');
  fireBtn.addEventListener('touchstart', function(e) { e.preventDefault(); initAudio(); fireWeapon(); }, { passive: false });
  fireBtn.addEventListener('mousedown', function(e) { e.preventDefault(); initAudio(); fireWeapon(); });

  function launchStage(stageIndex, keepScore) {
    initAudio();
    overlay.style.display = 'none';
    loadLevel(stageIndex, keepScore);
    mode = 'play';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  startBtn.onclick = function() {
    if (mode === 'nextlevel') launchStage(lvlIdx + 1, true);
    else if (mode === 'gameover') launchStage(lvlIdx, false); // Retry same sector!
    else launchStage(0, false);
  };
  contBtn.onclick = function() {
    launchStage(savedStage, false);
  };

  // --- UPDATE ---
  function update(dt) {
    if (muzzle > 0) muzzle = Math.max(0, muzzle - dt);
    if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt);
    if (coolTimer > 0) coolTimer--;
    if (msgTimer > 0) msgTimer -= dt;

    var rotSpeed = 2.4 * dt;
    var moveSpeed = 3.3 * dt;

    if (keys['ArrowLeft'] || keys['KeyA']) pDir -= rotSpeed;
    if (keys['ArrowRight'] || keys['KeyD']) pDir += rotSpeed;

    var moved = false;
    var cos = Math.cos(pDir), sin = Math.sin(pDir);
    if (keys['ArrowUp'] || keys['KeyW']) {
      if (canWalk(px + cos * moveSpeed, py)) px += cos * moveSpeed;
      if (canWalk(px, py + sin * moveSpeed)) py += sin * moveSpeed;
      moved = true;
    }
    if (keys['ArrowDown'] || keys['KeyS']) {
      if (canWalk(px - cos * moveSpeed, py)) px -= cos * moveSpeed;
      if (canWalk(px, py - sin * moveSpeed)) py -= sin * moveSpeed;
      moved = true;
    }
    if (moved) weaponBob += dt * 10;

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!it.got && Math.hypot(px - it.x, py - it.y) < 0.7) {
        it.got = true;
        if (it.type === 'bone') {
          hp = Math.min(maxHp, hp + 40);
          score += 100;
          showMsg('+40 DOGE MEDKIT!');
          beep(520, 880, 0.15, 'triangle');
        } else {
          ammo += 20;
          score += 150;
          showMsg('+20 D-BLASTER AMMO!');
          beep(660, 990, 0.15, 'triangle');
        }
      }
    }

    var aliveCount = 0;
    var isEasy = (difficulty === 'easy');
    for (var j = 0; j < enemies.length; j++) {
      var e = enemies[j];
      if (!e.alive) continue;
      aliveCount++;
      if (e.hurt > 0) e.hurt -= dt;

      var dx = px - e.x, dy = py - e.y;
      var dist = Math.hypot(dx, dy);

      if (dist < 8.0 && dist > 0.9) {
        var spd = (e.type === 'boss' ? 1.1 : 0.9) * (isEasy ? 0.7 : 1.0) * dt;
        var nx = e.x + (dx / dist) * spd;
        var ny = e.y + (dy / dist) * spd;
        if (canWalk(nx, e.y)) e.x = nx;
        if (canWalk(e.x, ny)) e.y = ny;
      }

      if (dist < 1.35) {
        e.atkCD -= dt;
        if (e.atkCD <= 0) {
          e.atkCD = isEasy ? 1.6 : 1.2;
          var baseDmg = e.type === 'boss' ? 18 : 10;
          var dmg = isEasy ? Math.ceil(baseDmg * 0.5) : baseDmg;
          hp = Math.max(0, hp - dmg);
          hurtFlash = 0.25;
          beep(150, 60, 0.2, 'sawtooth');
          if (hp <= 0) {
            mode = 'gameover';
            ovTitle.textContent = 'YOU GOT REKT!';
            ovTitle.style.color = '#ef4444';
            ovSub.innerHTML = 'FALLEN IN SECTOR ' + (lvlIdx + 1) + ' &bull; SCORE: ' + score + '<br>CONTINUE DIRECTLY FROM SECTOR ' + (lvlIdx + 1) + '!';
            startBtn.textContent = 'CONTINUE SECTOR ' + (lvlIdx + 1);
            updateContinueUI();
            overlay.style.display = 'flex';
            return;
          }
        }
      }
    }

    var curTile = map[Math.floor(py)] ? map[Math.floor(py)][Math.floor(px)] : 0;
    if (curTile === 9) {
      if (aliveCount > 0) {
        showMsg('DEFEAT ALL ' + aliveCount + ' FUD ENEMIES FIRST!');
      } else {
        score += 500;
        beep(523, 1046, 0.3, 'triangle');
        if (lvlIdx < 9) {
          mode = 'nextlevel';
          savedStage = Math.max(savedStage, lvlIdx + 1);
          try { localStorage.setItem('papeto_doom_stage', String(savedStage)); } catch (e) {}
          ovTitle.textContent = 'SECTOR ' + (lvlIdx + 1) + ' CLEARED!';
          ovTitle.style.color = '#4ade80';
          ovSub.innerHTML = 'SCORE: ' + score + ' &bull; BONUS HP & AMMO<br>NEXT: ' + SECTOR_NAMES[lvlIdx + 1];
          startBtn.textContent = 'ENTER SECTOR ' + (lvlIdx + 2);
          contBtn.style.display = 'none';
          overlay.style.display = 'flex';
        } else {
          mode = 'win';
          ovTitle.textContent = 'ALL 10 SECTORS CLEARED!';
          ovTitle.style.color = '#facc15';
          ovSub.innerHTML = 'MEGA FUD EMPEROR DESTROYED!<br>FINAL SCORE: ' + score + ' &bull; BY PAPETO';
          startBtn.textContent = 'PLAY AGAIN';
          contBtn.style.display = 'none';
          overlay.style.display = 'flex';
        }
        return;
      }
    }
  }

  // --- RENDER ---
  function render() {
    var ceilGrad = ctx.createLinearGradient(0, 0, 0, VIEW_H / 2);
    ceilGrad.addColorStop(0, '#09090b');
    ceilGrad.addColorStop(1, '#27272a');
    ctx.fillStyle = ceilGrad;
    ctx.fillRect(0, 0, W, VIEW_H / 2);

    var floorGrad = ctx.createLinearGradient(0, VIEW_H / 2, 0, VIEW_H);
    floorGrad.addColorStop(0, '#18181b');
    floorGrad.addColorStop(1, '#3f3f46');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, VIEW_H / 2, W, VIEW_H / 2);

    var fov = Math.PI / 3;
    for (var x = 0; x < W; x++) {
      var rayAngle = pDir - fov / 2 + (x / W) * fov;
      var rayDirX = Math.cos(rayAngle);
      var rayDirY = Math.sin(rayAngle);

      var mapX = Math.floor(px), mapY = Math.floor(py);
      var deltaDistX = Math.abs(1 / (rayDirX || 0.0001));
      var deltaDistY = Math.abs(1 / (rayDirY || 0.0001));

      var stepX, stepY, sideDistX, sideDistY;
      if (rayDirX < 0) { stepX = -1; sideDistX = (px - mapX) * deltaDistX; }
      else { stepX = 1; sideDistX = (mapX + 1.0 - px) * deltaDistX; }
      if (rayDirY < 0) { stepY = -1; sideDistY = (py - mapY) * deltaDistY; }
      else { stepY = 1; sideDistY = (mapY + 1.0 - py) * deltaDistY; }

      var hit = 0, side = 0;
      while (hit === 0) {
        if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
        else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
        hit = (map[mapY] && map[mapY][mapX] !== undefined) ? map[mapY][mapX] : 1;
      }

      var rawDist = side === 0 ? (sideDistX - deltaDistX) : (sideDistY - deltaDistY);
      var perpDist = Math.max(0.1, rawDist * Math.cos(rayAngle - pDir));
      zBuffer[x] = perpDist;

      var wallX = side === 0 ? (py + rawDist * rayDirY) : (px + rawDist * rayDirX);
      wallX -= Math.floor(wallX);
      var texX = Math.floor(wallX * TEX);
      if ((side === 0 && rayDirX < 0) || (side === 1 && rayDirY > 0)) texX = TEX - texX - 1;

      var lineH = Math.floor(VIEW_H / perpDist);
      var drawStart = Math.floor(VIEW_H / 2 - lineH / 2);

      var texCanvas = textures[hit] || textures[1];
      ctx.drawImage(texCanvas, texX, 0, 1, TEX, x, drawStart, 1, lineH);

      var dark = Math.min(0.75, (perpDist * 0.085) + (side === 1 ? 0.22 : 0));
      if (dark > 0.02) {
        ctx.fillStyle = 'rgba(0,0,0,' + dark.toFixed(2) + ')';
        ctx.fillRect(x, Math.max(0, drawStart), 1, Math.min(VIEW_H, lineH));
      }
    }

    // --- 3D SPRITES ---
    var sprites = [];
    for (var i = 0; i < enemies.length; i++) if (enemies[i].alive) sprites.push({ x: enemies[i].x, y: enemies[i].y, kind: enemies[i].type });
    for (var j = 0; j < items.length; j++) if (!items[j].got) sprites.push({ x: items[j].x, y: items[j].y, kind: items[j].type });
    sprites.sort(function(a, b) { return Math.hypot(b.x - px, b.y - py) - Math.hypot(a.x - px, a.y - py); });

    var dirX = Math.cos(pDir), dirY = Math.sin(pDir);
    var planeX = -dirY * Math.tan(fov / 2), planeY = dirX * Math.tan(fov / 2);
    var invDet = 1.0 / (planeX * dirY - dirX * planeY);

    for (var s = 0; s < sprites.length; s++) {
      var sp = sprites[s];
      var sx = sp.x - px, sy = sp.y - py;
      var transformX = invDet * (dirY * sx - dirX * sy);
      var transformY = invDet * (-planeY * sx + planeX * sy);
      if (transformY <= 0.2) continue;

      var screenX = Math.floor((W / 2) * (1 + transformX / transformY));
      var spSize = Math.abs(Math.floor(VIEW_H / transformY)) * (sp.kind === 'boss' ? 1.35 : 0.85);
      var topY = Math.floor(VIEW_H / 2 - spSize / 2 + (sp.kind === 'coin' || sp.kind === 'bone' ? spSize * 0.15 : 0));

      var startX = Math.max(0, Math.floor(screenX - spSize / 2));
      var endX = Math.min(W - 1, Math.floor(screenX + spSize / 2));
      var spTex = spritesTex[sp.kind];

      for (var stripe = startX; stripe <= endX; stripe++) {
        if (transformY < zBuffer[stripe]) {
          var texX2 = Math.floor(((stripe - (screenX - spSize / 2)) / spSize) * TEX);
          ctx.drawImage(spTex, texX2, 0, 1, TEX, stripe, topY, 1, spSize);
        }
      }
    }

    // --- BOSS HP BAR IN SECTOR 10 ---
    for (var bIdx = 0; bIdx < enemies.length; bIdx++) {
      var bObj = enemies[bIdx];
      if (bObj.type === 'boss' && bObj.alive) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.85)';
        ctx.fillRect(60, 20, 200, 12);
        ctx.strokeStyle = '#eab308';
        ctx.strokeRect(60, 20, 200, 12);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(62, 22, 196 * (bObj.hp / bObj.maxHp), 8);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 7px Courier New';
        ctx.fillText('MEGA FUD EMPEROR: ' + bObj.hp + '/' + bObj.maxHp, 102, 28);
      }
    }

    // --- MINI-MAP ---
    var ms = 3;
    ctx.fillStyle = 'rgba(9, 9, 11, 0.8)';
    ctx.fillRect(4, 4, map[0].length * ms + 2, map.length * ms + 2);
    for (var r = 0; r < map.length; r++) {
      for (var c = 0; c < map[0].length; c++) {
        var v = map[r][c];
        if (v > 0) {
          ctx.fillStyle = v === 9 ? '#22c55e' : (v === 2 || v === 3 ? '#facc15' : '#b91c1c');
          ctx.fillRect(5 + c * ms, 5 + r * ms, ms, ms);
        }
      }
    }
    for (var k = 0; k < enemies.length; k++) {
      if (enemies[k].alive) {
        ctx.fillStyle = enemies[k].type === 'boss' ? '#facc15' : '#ef4444';
        ctx.fillRect(4 + enemies[k].x * ms, 4 + enemies[k].y * ms, enemies[k].type === 'boss' ? 3.5 : 2.2, enemies[k].type === 'boss' ? 3.5 : 2.2);
      }
    }
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(4 + px * ms, 4 + py * ms, 2.5, 2.5);

    // --- 3D DOGE-BLASTER WEAPON ---
    var bobX = Math.cos(weaponBob) * 4;
    var bobY = Math.abs(Math.sin(weaponBob)) * 4 + (muzzle > 0 ? 6 : 0);
    var gx = W / 2 - 22 + bobX;
    var gy = VIEW_H - 42 + bobY;

    if (muzzle > 0) {
      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(W / 2 + bobX, gy - 2, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f97316';
      ctx.beginPath(); ctx.arc(W / 2 + bobX, gy - 2, 9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#27272a'; ctx.fillRect(gx + 6, gy + 8, 32, 34);
    ctx.fillStyle = '#52525b'; ctx.fillRect(gx + 10, gy + 2, 24, 40);
    ctx.fillStyle = '#eab308'; ctx.fillRect(gx + 15, gy, 14, 34);
    ctx.fillStyle = '#fef08a'; ctx.fillRect(gx + 19, gy + 2, 6, 26);
    ctx.fillStyle = '#09090b'; ctx.font = 'bold 10px Courier New'; ctx.fillText('D', gx + 19, gy + 20);

    // Crosshair
    ctx.strokeStyle = '#facc15';
    ctx.beginPath();
    ctx.moveTo(W / 2 - 4, VIEW_H / 2); ctx.lineTo(W / 2 + 4, VIEW_H / 2);
    ctx.moveTo(W / 2, VIEW_H / 2 - 4); ctx.lineTo(W / 2, VIEW_H / 2 + 4);
    ctx.stroke();

    if (hurtFlash > 0) {
      ctx.fillStyle = 'rgba(220, 38, 38, 0.35)';
      ctx.fillRect(0, 0, W, VIEW_H);
    }

    if (msgTimer > 0) {
      ctx.font = 'bold 9px Courier New';
      ctx.fillStyle = '#fef08a';
      ctx.fillText(msgText, 54, 14);
    }

    // --- BOTTOM HUD ---
    ctx.fillStyle = '#18181b';
    ctx.fillRect(0, VIEW_H, W, HUD_H);
    ctx.strokeStyle = '#eab308';
    ctx.strokeRect(0.5, VIEW_H + 0.5, W - 1, HUD_H - 1);

    var fx = W / 2 - 16, fy = VIEW_H + 3;
    ctx.fillStyle = '#27272a'; ctx.fillRect(fx, fy, 32, 32);
    ctx.strokeStyle = '#eab308'; ctx.strokeRect(fx, fy, 32, 32);
    ctx.fillStyle = '#ca8a04';
    ctx.beginPath(); ctx.moveTo(fx + 6, fy + 11); ctx.lineTo(fx + 9, fy + 3); ctx.lineTo(fx + 13, fy + 9); ctx.fill();
    ctx.beginPath(); ctx.moveTo(fx + 26, fy + 11); ctx.lineTo(fx + 23, fy + 3); ctx.lineTo(fx + 19, fy + 9); ctx.fill();
    ctx.fillStyle = '#eab308'; ctx.beginPath(); ctx.arc(fx + 16, fy + 17, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fef9c3'; ctx.beginPath(); ctx.ellipse(fx + 16, fy + 20, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#09090b';
    if (coolTimer > 0) {
      ctx.fillRect(fx + 7, fy + 13, 18, 4);
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(fx + 9, fy + 14, 5, 2); ctx.fillRect(fx + 18, fy + 14, 5, 2);
    } else {
      ctx.fillRect(fx + 11, fy + 14, 2, 2); ctx.fillRect(fx + 19, fy + 14, 2, 2);
      ctx.fillRect(fx + 15, fy + 18, 3, 2);
    }

    ctx.font = 'bold 8px Courier New';
    ctx.fillStyle = '#a1a1aa';
    ctx.fillText('AMMO', 10, VIEW_H + 12);
    ctx.fillText('HEALTH', 64, VIEW_H + 12);
    ctx.fillText('SECTOR', 202, VIEW_H + 12);
    ctx.fillText('SCORE', 260, VIEW_H + 12);

    ctx.font = 'bold 12px Courier New';
    ctx.fillStyle = '#facc15';
    ctx.fillText(String(ammo), 10, VIEW_H + 28);
    ctx.fillStyle = hp > 40 ? '#4ade80' : '#ef4444';
    ctx.fillText(String(hp), 64, VIEW_H + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.fillText((lvlIdx + 1) + '/10', 202, VIEW_H + 28);
    ctx.fillStyle = '#facc15';
    ctx.fillText(String(score), 260, VIEW_H + 28);
  }

  function loop(now) {
    if (mode !== 'play') return;
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  loadLevel(0, false);
  render();
})();
</script>
</body>
