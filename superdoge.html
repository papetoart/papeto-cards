 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER DOGE BROS HD - 10 Worlds NFT</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            border: 4px solid #f39c12;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
            background: #000;
            width: 800px;
            max-width: 100%;
            height: 450px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #f1c40f;
            margin-bottom: 5px;
            font-size: 28px;
            text-shadow: 2px 2px #c0392b;
        }
        p {
            color: #ecf0f1;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px #c0392b;
            transition: 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #c0392b;
        }
        canvas {
            display: none;
            background: #5c94fc;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="menu">
            <h1>SUPER DOGE BROS HD</h1>
            <p>10 Worlds Edition | Starring Shiba Doge</p>
            <button class="btn" onclick="launchGame()">PLAY GAME</button>
        </div>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <script>
        function launchGame() {
            document.getElementById('menu').style.display = 'none';
            const canvas = document.getElementById('gameCanvas');
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');

            // Βασικός loop παιχνιδιού (Platformer Engine)
            let doge = { x: 50, y: 300, w: 30, h: 30, vy: 0, grounded: false };
            let keys = {};

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            function update() {
                if (keys['ArrowRight'] || keys['KeyD']) doge.x += 4;
                if (keys['ArrowLeft'] || keys['KeyA']) doge.x -= 4;
                if ((keys['Space'] || keys['ArrowUp']) && doge.grounded) {
                    doge.vy = -10;
                    doge.grounded = false;
                }

                doge.vy += 0.5; // Βαρύτητα
                doge.y += doge.vy;

                if (doge.y > 340) {
                    doge.y = 340;
                    doge.vy = 0;
                    doge.grounded = true;
                }
            }

            function draw() {
                // Ουρανός
                ctx.fillStyle = '#5c94fc';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Έδαφος
                ctx.fillStyle = '#00aa00';
                ctx.fillRect(0, 370, canvas.width, 80);
                ctx.fillStyle = '#d75b00';
                ctx.fillRect(0, 370, canvas.width, 10);

                // Doge (Παίκτης)
                ctx.fillStyle = '#f39c12';
                ctx.fillRect(doge.x, doge.y, doge.w, doge.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(doge.x + 18, doge.y + 6, 8, 8); // Μάτι

                // Κείμενο οδηγιών
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Courier New';
                ctx.fillText("Use A/D or Arrows to Move, SPACE to Jump", 20, 30);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            loop();
        }
    </script>

</body>
</html>
