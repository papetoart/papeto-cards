 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER DOGE BROS HD - 10 Worlds NFT</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            border: 4px solid #f39c12;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
            background: #000;
            width: 800px;
            max-width: 100%;
            height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        h1 {
            color: #f1c40f;
            margin-bottom: 5px;
            font-size: 28px;
            text-shadow: 2px 2px #c0392b;
        }
        p {
            color: #ecf0f1;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px #c0392b;
            transition: 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #c0392b;
        }
        .info {
            margin-top: 15px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>SUPER DOGE BROS HD</h1>
        <p>10 Worlds Edition | Starring Shiba Doge vs Mega FUD King</p>
        
        <button class="btn" onclick="startGame()">PLAY GAME</button>
        
        <div class="info">Created by papeto | Dogeparty NFT Game</div>
    </div>

    <script>
        function startGame() {
            alert("🚀 Loading Super Doge Bros HD Worlds... Let's go!");
            // Εδώ μπορείς αργότερα να βάλεις τη λογική εκκίνησης του κανονικού καμβά (canvas) του παιχνιδιού σου.
        }
    </script>

</body>
</html>
